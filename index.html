.modal{background:var(--panel);border:1px solid var(--border);border-radius:22px 22px 0 0;width:100%;max-width:var(--app-max-width);padding:22px;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:18px;font-weight:700}
.modal-sub{color:var(--text-dim);font-size:12.5px;margin:0 0 18px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.duration-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.duration-btn{padding:12px 6px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;text-align:center}
.duration-btn .d-sub{display:block;font-size:10px;font-weight:600;color:var(--text-dim);margin-top:2px}
.duration-btn.active{border-color:var(--blue);color:#eaf1ff;background:linear-gradient(120deg, rgba(79,141,253,.28), rgba(139,123,255,.2))}
.duration-btn.active .d-sub{color:#1d4ed8}

.upload-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.upload-slot{aspect-ratio:1;border-radius:14px;border:1.5px dashed var(--border-hi);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;position:relative;overflow:hidden;color:var(--text-dim);font-size:11px;font-weight:600;text-align:center;padding:8px}
.upload-slot.filled{border-style:solid;border-color:var(--ok);color:var(--text)}
.upload-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.upload-slot .req{color:#ffffff;font-size:9px;font-weight:800;position:absolute;top:6px;right:6px;background:rgba(225,29,72,.92);padding:2px 6px;border-radius:100px}
.upload-slot .opt{color:#ffffff;font-size:9px;font-weight:700;position:absolute;top:6px;right:6px;background:rgba(20,30,60,.75);padding:2px 6px;border-radius:100px}
.upload-slot input{display:none}
.upload-slot .check{position:absolute;bottom:6px;right:6px;background:var(--ok);color:#ffffff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}

.bg-progress{
  position:fixed;bottom:78px;left:50%;transform:translateX(-50%);z-index:25;
  background:var(--surface-solid);border:1px solid var(--border);border-radius:100px;
  padding:10px 16px 10px 12px;display:flex;align-items:center;gap:9px;
  box-shadow:0 8px 22px rgba(20,30,60,.14);font-size:12.5px;font-weight:600;color:var(--text-dim);
}
.bg-progress-spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--cyan);animation:spin .7s linear infinite;flex-shrink:0}

.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:calc(100% - 28px);max-width:calc(var(--app-max-width) - 28px)}
.toast{padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 10px 26px rgba(20,30,60,.14);animation:toastIn .2s ease;backdrop-filter:blur(14px)}
.toast.success{background:rgba(79,141,253,.16);color:#1d4ed8;border:1px solid rgba(79,141,253,.35)}
.toast.error{background:rgba(251,113,133,.14);color:var(--danger);border:1px solid rgba(251,113,133,.32)}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

.loc-btn{
  width:100%;background:var(--surface-2);border:1px dashed var(--border-hi);border-radius:12px;
  padding:12px;color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;
}
.loc-btn.picked{border-style:solid;border-color:var(--ok);color:var(--ok);background:rgba(79,209,165,.08)}
.map-modal{background:var(--panel);border:1px solid var(--border);border-radius:22px 22px 0 0;width:100%;max-width:var(--app-max-width);padding:16px;max-height:90vh;display:flex;flex-direction:column;gap:12px}
#leafletMap{width:100%;height:340px;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.locate-me-btn{
  position:absolute;bottom:12px;right:12px;z-index:1000;width:38px;height:38px;border-radius:10px;
  background:#ffffff;border:1px solid var(--border);color:var(--blue);
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(20,30,60,.22);
}
.locate-me-btn:active{transform:scale(.94)}
.locate-me-btn.loading{color:var(--text-dim)}
.my-location-dot{width:16px;height:16px;border-radius:50%;background:var(--blue);border:3px solid #ffffff;box-shadow:0 0 0 2px rgba(47,111,237,.5), 0 2px 6px rgba(20,30,60,.3)}
.map-hint{font-size:12px;color:var(--text-dim);text-align:center}
.map-coords{font-family:var(--mono);font-size:12.5px;text-align:center;color:var(--cyan)}

.sorov-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;position:relative}
.sorov-card.pending{border-color:rgba(251,191,36,.4)}
.sorov-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sorov-actions{display:flex;gap:8px;margin-top:12px}
.sorov-status{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;display:inline-block;margin-top:8px}
.sorov-status.kutilmoqda{background:rgba(251,191,36,.14);color:var(--warn)}
.sorov-status.qabul{background:rgba(79,209,165,.14);color:var(--ok)}
.sorov-status.rad{background:rgba(251,113,133,.14);color:var(--danger)}
.req-note{font-size:11px;font-weight:700;margin-top:8px;padding:6px 10px;border-radius:9px;display:inline-block}
.req-note.rejected{background:rgba(251,113,133,.12);color:var(--danger)}
.xabarlar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:11px 14px;margin-bottom:14px}
.check-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);cursor:pointer;user-select:none}
.check-row input[type="checkbox"]{width:17px;height:17px;accent-color:var(--blue);cursor:pointer}
.sorov-check{position:absolute;top:14px;right:14px;width:18px;height:18px;accent-color:var(--blue);cursor:pointer}

.corner-btn{
  position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;
  border:1px solid rgba(217,119,6,.35);background:rgba(217,119,6,.10);color:var(--warn);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;z-index:2;
}
.corner-btn:active{transform:scale(.94)}
.corner-btn.pending{color:var(--text-dim);background:var(--surface-2);border-color:var(--border);cursor:default}
.corner-btn:disabled{cursor:default}
.ticket-main.has-corner{padding-right:52px}
</style>

  <span id="bgProgressText">Yuborilmoqda...</span>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTjE4zHu_-UL4Lml-RFesU0TAh2HGvV951VM31LGIxk-gGS1ICulC1kJH-DzVr_l1mOg/exec";
const EMPLOYEES_URL = APPS_SCRIPT_URL + "?action=employees";
const BOOTSTRAP_URL = APPS_SCRIPT_URL + "?action=bootstrap";

let employees = [], sklad = [], kirim = [], chiqim = [], sorovlar = [], tugaganlar = [];
let currentUser = null;
let skladTumanFilter = 'all';
let skladMarkaFilter = '';

function normalize(s){ return (s||'').toString().trim().toLowerCase(); }
function normalizeTuman(raw){
  const s = normalize(raw);
  if(s.indexOf('buxoro') > -1) return 'buxoro';
  if(s.indexOf('kogon') > -1) return 'kogon';
  return s;
}
function tumanLabel(raw){
  const t = normalizeTuman(raw);
  return t==='buxoro' ? 'Buxoro' : t==='kogon' ? 'Kogon' : escapeHtml(raw||'');
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function barcodeSpans(n){ let h=''; for(let i=0;i<n;i++) h+='<span></span>'; return h; }

function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'success');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), type==='error' ? 20000 : 3200);
}

async function fetchJson(url){
  const resp = await fetch(url, { method:'GET', cache:'no-store' });
  if(!resp.ok) throw new Error('HTTP '+resp.status);
  return await resp.json();
}

async function postAction(payload){
  const resp = await fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify(payload) });
  let result;
  try{ result = await resp.json(); }catch(e){ throw new Error("Server javobini o'qib bo'lmadi"); }
  if(!result.success) throw new Error(result.error || "Noma'lum xatolik");
  return result;
}

function muddatInfoText(d){
  if(!d.MuddatSoat) return '';
  const soat = Number(d.MuddatSoat);
  if(!soat) return '';
  if(soat >= 24 && soat % 24 === 0){
    const kun = soat / 24;
    return kun + ' kun (' + soat + ' soat)ga olingan';
  }
  return soat + ' soatga olingan';
}

function getLatestRequest(seria, turi){
  const login = normalize(currentUser.login);
  let latest = null;
  for(const r of sorovlar){
    if(normalize(r.seria) === normalize(seria) && (r.turi||'').toString().trim() === turi && normalize(r.login) === login){
      latest = r;
    }
  }
  return latest;
}

let bgTaskCount = 0;
function bgTaskStart(label){
  bgTaskCount++;
  const badge = document.getElementById('bgProgressBadge');
  document.getElementById('bgProgressText').textContent = label;
  badge.style.display = 'flex';
}
function bgTaskEnd(){
  bgTaskCount = Math.max(0, bgTaskCount - 1);
  if(bgTaskCount === 0) document.getElementById('bgProgressBadge').style.display = 'none';
}

function fileToCompressedBase64(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxDim / Math.max(w,h));
        w = Math.round(w*scale); h = Math.round(h*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadAll(){
  try{
    const data = await fetchJson(BOOTSTRAP_URL);
    employees = data.employees || employees;
    sklad = data.sklad || []; kirim = data.kirim || []; chiqim = data.chiqim || []; sorovlar = data.sorovlar || []; tugaganlar = data.tugaganlar || [];
  }catch(err){
    toast("Ma'lumotlarni yuklashda xatolik", 'error');
  }
}

async function initApp(){
  await loadAll();
  document.getElementById('loadingScreen').style.display = 'none';
  const saved = localStorage.getItem('sklad_user');
  if(saved){
    try{ currentUser = JSON.parse(saved); enterApp(); return; }catch(e){}
  }
  document.getElementById('loginScreen').style.display = 'flex';
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('passInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const loginVal = document.getElementById('loginInput').value.trim();
  const passVal = document.getElementById('passInput').value.trim();
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.classList.remove('show');
  if(!loginVal || !passVal){ errEl.textContent="Login va parolni to'liq kiriting"; errEl.classList.add('show'); return; }
  btn.disabled = true; btn.textContent = 'Tekshirilmoqda...';
  try{
    if(employees.length === 0){ employees = await fetchJson(EMPLOYEES_URL); }
    const found = employees.find(e => normalize(e.LOGIN) === normalize(loginVal) && (e.PAROL||'').toString().trim() === passVal);
    if(found){
      currentUser = { ism: found.ISM, login: found.LOGIN, tuman: (found.tuman||'').toString().trim(), role: (found.dostup||'xodim').toString().trim().toLowerCase() };
      localStorage.setItem('sklad_user', JSON.stringify(currentUser));
      enterApp();
    }else{
      errEl.textContent = "Login yoki parol noto'g'ri"; errEl.classList.add('show');
    }
  }catch(err){
    errEl.textContent = "Xatolik yuz berdi, qayta urinib ko'ring"; errEl.classList.add('show');
  }finally{
    btn.disabled = false; btn.textContent = 'Kirish';
  }
}

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  localStorage.removeItem('sklad_user');
  location.reload();
});

function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('userName').textContent = currentUser.ism;
  const isAdmin = currentUser.role === 'admin';
  document.getElementById('addBtn').style.display = isAdmin ? 'flex' : 'none';
  document.getElementById('navXabarlar').style.display = isAdmin ? 'flex' : 'none';
  document.getElementById('statMeningLbl').textContent = isAdmin ? 'Qabul qilingan' : 'Mening olganlarim';
  document.getElementById('meningTitle').textContent = isAdmin
    ? "Barcha qabul qilingan qurilmalar (kimda turgani bilan)"
    : "Siz olgan, hali o'rnatilmagan qurilmalar";
  renderActive();
  updateStats();
}

async function refreshData(){
  await loadAll();
  renderActive();
  updateStats();
  toast('Yangilandi', 'success');
}
document.getElementById('refreshBtnTop').addEventListener('click', refreshData);

function updateStats(){
  document.getElementById('statSklad').textContent = sklad.length;
  const isAdmin = currentUser.role === 'admin';
  const meningCount = isAdmin
    ? kirim.length + tugaganlar.length
    : kirim.filter(d=>normalize(d.login)===normalize(currentUser.login)).length + tugaganlar.filter(d=>normalize(d.login)===normalize(currentUser.login)).length;
  document.getElementById('statMening').textContent = meningCount;
  document.getElementById('statChiqim').textContent = chiqim.length;
  const countEl = document.getElementById('meningCount');
  if(meningCount > 0){ countEl.style.display='flex'; countEl.textContent = meningCount; } else { countEl.style.display='none'; }
  const pending = sorovlar.filter(r => (r.holat||'').toString().trim() === 'kutilmoqda').length;
  const xEl = document.getElementById('xabarlarCount');
  if(isAdmin && pending > 0){ xEl.style.display='flex'; xEl.textContent = pending; } else { xEl.style.display='none'; }
}

const panelSklad = document.getElementById('panelSklad');
const panelMening = document.getElementById('panelMening');
const panelTarix = document.getElementById('panelTarix');
const panelXabarlar = document.getElementById('panelXabarlar');
const navBtns = {
  sklad: document.getElementById('navSklad'),
  mening: document.getElementById('navMening'),
  tarix: document.getElementById('navTarix'),
  xabarlar: document.getElementById('navXabarlar')
};
let activePanel = 'sklad';

const skladFilterOverlay = document.getElementById('skladFilterOverlay');
document.getElementById('skladFilterBtn').addEventListener('click', ()=>{
  const markaSel = document.getElementById('filterMarka');
  const uniqueMarkalar = Array.from(new Set(sklad.map(d => (d.marka||'').toString().trim()).filter(Boolean))).sort();
  markaSel.innerHTML = '<option value="">Barcha markalar</option>' +
    uniqueMarkalar.map(m => `<option value="${escapeHtml(m)}"${m===skladMarkaFilter?' selected':''}>${escapeHtml(m)}</option>`).join('');
  document.getElementById('filterTuman').value = skladTumanFilter;
  skladFilterOverlay.classList.add('show');
});
skladFilterOverlay.addEventListener('click', e=>{ if(e.target===skladFilterOverlay) skladFilterOverlay.classList.remove('show'); });
document.getElementById('filterApply').addEventListener('click', ()=>{
  skladMarkaFilter = document.getElementById('filterMarka').value;
  skladTumanFilter = document.getElementById('filterTuman').value;

document.getElementById('filterReset').addEventListener('click', ()=>{
  skladMarkaFilter = '';
  skladTumanFilter = 'all';
  document.getElementById('filterMarka').value = '';
  document.getElementById('filterTuman').value = 'all';
  skladFilterOverlay.classList.remove('show');
  renderSklad();
});

function renderActive(){
  if(activePanel==='sklad') renderSklad();
  else if(activePanel==='mening') renderMening();
  else if(activePanel==='tarix') renderTarix();
  else renderXabarlar();
}

function showPanel(name){
  activePanel = name;
  Object.values(navBtns).forEach(b=>b.classList.remove('active'));
  navBtns[name].classList.add('active');
  panelSklad.style.display = name==='sklad' ? 'block':'none';
  panelMening.style.display = name==='mening' ? 'block':'none';
  panelTarix.style.display = name==='tarix' ? 'block':'none';
  panelXabarlar.style.display = name==='xabarlar' ? 'block':'none';
  renderActive();
}
Object.keys(navBtns).forEach(name=> navBtns[name].addEventListener('click', ()=>showPanel(name)));

const skladSearch = document.getElementById('skladSearch');
const skladSearchClear = document.getElementById('skladSearchClear');
skladSearch.addEventListener('input', ()=>{ skladSearchClear.style.display = skladSearch.value?'flex':'none'; renderSklad(); });
skladSearchClear.addEventListener('click', ()=>{ skladSearch.value=''; skladSearchClear.style.display='none'; renderSklad(); });

function renderSklad(){
  const q = normalize(skladSearch.value.trim());
  let list = sklad.slice();
  if(skladTumanFilter !== 'all') list = list.filter(d => normalizeTuman(d.tuman) === skladTumanFilter);
  if(skladMarkaFilter) list = list.filter(d => normalize(d.marka) === normalize(skladMarkaFilter));
  if(q.length >= 2) list = list.filter(d => normalize(d['S/N']).includes(q));
  document.getElementById('skladFilterDot').style.display = skladMarkaFilter ? 'block' : 'none';
  const el = document.getElementById('skladResults');
  if(list.length === 0){ el.innerHTML = `<div class="empty-msg">${q ? "Hech narsa topilmadi" : "Skladda qurilma yo'q"}</div>`; return; }
  const isAdmin = currentUser.role === 'admin';
  el.innerHTML = list.slice(0,150).map(d => {
    const ownTuman = normalizeTuman(d.tuman) === normalizeTuman(currentUser.tuman);
    const canTake = isAdmin || ownTuman;
    return `
    <div class="ticket">
      <div class="ticket-main">
        <div class="ticket-code"><span class="bar">${barcodeSpans(8)}</span>${escapeHtml(d['S/N']||'')}</div>
        <div class="ticket-sub">${escapeHtml(d.marka||'')}</div>
        <div class="ticket-tags"><span class="ticket-tag">${tumanLabel(d.tuman)}</span></div>
      </div>
      <div class="action-stack">
        ${canTake
          ? `<button class="big-btn primary" onclick="openOlish('${encodeURIComponent(d['S/N'])}')">✅ Oldim</button>`
          : `<div class="ticket-sub" style="padding-bottom:4px">Bu qurilma boshqa tumanga tegishli</div>`}
      </div>
    </div>`;
  }).join('');
}

let olishSeria = null, olishFileData = null, olishMuddatSoat = null;
const olishOverlay = document.getElementById('olishOverlay');
function openOlish(seriaEnc){
  olishSeria = decodeURIComponent(seriaEnc);
  olishFileData = null;
  olishMuddatSoat = null;
  document.getElementById('olishTitle').textContent = 'Qurilmani olish — ' + olishSeria;
  document.getElementById('olishManzil').value = '';
  document.querySelectorAll('#olishDurationGrid .duration-btn').forEach(b=>b.classList.remove('active'));
  const slot = document.getElementById('olishSlot');
  slot.classList.remove('filled');
  slot.innerHTML = `<span class="req">Majburiy</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/></svg><span>Talabnoma rasmini yuklash</span><input type="file" accept="image/*" id="olishFile">`;
  document.getElementById('olishFile').addEventListener('change', onOlishFile);
  olishOverlay.classList.add('show');
}
window.openOlish = openOlish;
document.querySelectorAll('#olishDurationGrid .duration-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#olishDurationGrid .duration-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    olishMuddatSoat = btn.dataset.hours;
  });
});
async function onOlishFile(e){
  const file = e.target.files[0];
  if(!file) return;
  olishFileData = await fileToCompressedBase64(file, 1280);
  const slot = document.getElementById('olishSlot');
  slot.classList.add('filled');
  slot.innerHTML = `<img src="${olishFileData}"><span class="check">✓</span><input type="file" accept="image/*" id="olishFile">`;
  document.getElementById('olishFile').addEventListener('change', onOlishFile);
}
document.getElementById('olishCancel').addEventListener('click', ()=> olishOverlay.classList.remove('show'));
olishOverlay.addEventListener('click', e=>{ if(e.target===olishOverlay) olishOverlay.classList.remove('show'); });

document.getElementById('olishConfirm').addEventListener('click', ()=>{
  const manzil = document.getElementById('olishManzil').value.trim();
  if(!manzil){ toast('Manzilni kiriting', 'error'); return; }
  if(!olishMuddatSoat){ toast('Muddatni tanlang', 'error'); return; }
  if(!olishFileData){ toast('Talabnoma rasmini yuklang', 'error'); return; }
  const seria = olishSeria;
  const muddat_soat = olishMuddatSoat;
  olishOverlay.classList.remove('show');

  bgTaskStart('Biriktirilmoqda: ' + seria);
  postAction({ action:'olish', seria, login: currentUser.login, ism: currentUser.ism, role: currentUser.role, tuman: currentUser.tuman, manzil, muddat_soat, talabnoma_rasm: olishFileData })
    .then((res)=>{
      toast('Qurilma sizga biriktirildi', 'success');
      if(res.telegram_debug){ toast('TELEGRAM: ' + res.telegram_debug, 'error'); }
    })
    .catch(err=>{ toast(err.message, 'error'); })
    .finally(()=>{
      bgTaskEnd();
      loadAll().then(()=>{ renderActive(); updateStats(); });
    });
});

function renderMening(){
  const isAdmin = currentUser.role === 'admin';
  const activeList = (isAdmin ? kirim.slice() : kirim.filter(d => normalize(d.login) === normalize(currentUser.login)))
    .map(d => Object.assign({}, d, { _expired: false }));
  const expiredList = (isAdmin ? tugaganlar.slice() : tugaganlar.filter(d => normalize(d.login) === normalize(currentUser.login)))
    .map(d => Object.assign({}, d, { _expired: true }));
  const list = activeList.concat(expiredList);

  const el = document.getElementById('meningResults');
  if(list.length === 0){ el.innerHTML = `<div class="empty-msg">${isAdmin ? "Hozircha hech kimda qurilma yo'q" : "Siz hali hech qanday qurilma olmagansiz"}</div>`; return; }

  el.innerHTML = list.slice(0,150).map(d => {
    const expired = d._expired;
    const isOwner = normalize(d.login) === normalize(currentUser.login);
    const muddatText = muddatInfoText(d);

    const latestMuddat = (isOwner && !expired) ? getLatestRequest(d['S/N'], 'muddat') : null;
    const muddatPending = !!(latestMuddat && (latestMuddat.holat||'').trim() === 'kutilmoqda');
    const muddatRejected = !!(latestMuddat && (latestMuddat.holat||'').trim() === 'rad etilgan');
    let cornerBtnHtml = '';
    if(isOwner && !isAdmin && !expired){
      cornerBtnHtml = `<button class="corner-btn${muddatPending?' pending':''}" ${muddatPending?'disabled':''} title="${muddatPending?"Muddat so'rovi kutilmoqda":"Muddat qo'shishni so'rash"}" onclick="openSorov('${encodeURIComponent(d['S/N'])}')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </button>`;
    }

    const latestReturn = (isOwner && !expired) ? getLatestRequest(d['S/N'], 'qaytarish') : null;
    const returnPending = !!(latestReturn && (latestReturn.holat||'').trim() === 'kutilmoqda');
    const returnRejected = !!(latestReturn && (latestReturn.holat||'').trim() === 'rad etilgan');

    let actionsHtml;
    if(expired && isAdmin){
      actionsHtml = `
        <button class="big-btn primary" onclick="openFaollashtirish('${encodeURIComponent(d['S/N'])}')">🔓 Faollashtirish</button>
        <button class="big-btn ghost" onclick="qaytarish('${encodeURIComponent(d['S/N'])}')">↩️ Qaytarish</button>`;
    } else if(expired && !isAdmin){
      actionsHtml = `<div class="req-note rejected" style="margin-top:0">⛔ Muddat tugadi — hech qanday amal bajara olmaysiz, admin bilan bog'laning</div>`;
    } else if(isAdmin){
      actionsHtml = `
        <button class="big-btn primary" ${returnPending?'disabled':''} onclick="openInstall('${encodeURIComponent(d['S/N'])}')">✅ O'rnatish</button>
        <button class="big-btn ghost" onclick="qaytarish('${encodeURIComponent(d['S/N'])}')">↩️ Qaytarish</button>
        <button class="big-btn admin-end" onclick="muddatTugatish('${encodeURIComponent(d['S/N'])}')">⏰ Muddatni tugatish</button>`;
    } else {
      const returnBtnLabel = returnPending ? "⏳ Qaytarish so'rovi yuborilgan" : "↩️ Qaytarish so'rash";
      actionsHtml = `
        <button class="big-btn primary" ${returnPending?'disabled':''} onclick="openInstall('${encodeURIComponent(d['S/N'])}')">✅ O'rnatish</button>
        <button class="big-btn ghost" ${returnPending?'disabled':''} onclick="qaytarish('${encodeURIComponent(d['S/N'])}')">${returnBtnLabel}</button>`;
    }

    return `
    <div class="ticket${expired?' expired':''}">
      ${cornerBtnHtml}
      <div class="ticket-main${cornerBtnHtml ? ' has-corner' : ''}">
        <div class="ticket-code"><span class="bar">${barcodeSpans(8)}</span>${escapeHtml(d['S/N']||'')}</div>
        <div class="ticket-sub">${escapeHtml(d.marka||'')} · Olingan: ${escapeHtml(d.sana||'')}</div>
        ${d.manzil ? `<div class="ticket-sub">📍 ${escapeHtml(d.manzil)}</div>` : ''}
        ${isAdmin ? `<div class="ticket-sub">👤 Xodim: <b style="color:var(--text)">${escapeHtml(d.Ism||d.login||'')}</b></div>` : ''}
        <div class="ticket-tags">
          <span class="ticket-tag">${tumanLabel(d.tuman)}</span>
          ${muddatText ? `<span class="ticket-tag info">⏱ ${muddatText}</span>` : ''}
          ${expired ? `<span class="ticket-tag expired">Muddati tugagan</span>` : ''}
        </div>
        ${!isAdmin && !expired && returnRejected ? `<div class="req-note rejected">✕ So'nggi qaytarish so'rovingiz rad etildi</div>` : ''}
        ${!isAdmin && !expired && muddatRejected ? `<div class="req-note rejected">✕ So'nggi muddat so'rovingiz rad etildi</div>` : ''}
      </div>
      <div class="action-stack">
        ${actionsHtml}
      </div>
    </div>`;
  }).join('');
}

let selectedSorovIds = new Set();

function renderXabarlar(){
  const el = document.getElementById('xabarlarResults');
  const toolbar = document.getElementById('xabarlarToolbar');
  if(sorovlar.length === 0){
    toolbar.style.display = 'none';
    el.innerHTML = `<div class="empty-msg">Hozircha so'rovlar yo'q</div>`;
    return;
  }
  toolbar.style.display = 'flex';
  const validIds = new Set(sorovlar.map(r=>r.ID));
  selectedSorovIds.forEach(id=>{ if(!validIds.has(id)) selectedSorovIds.delete(id); });

  const sorted = sorovlar.slice().reverse();

  el.innerHTML = sorted.map(r=>{
    const holat = (r.holat||'').toString().trim();
    const isPending = holat === 'kutilmoqda';
    const statusCls = holat==='kutilmoqda' ? 'kutilmoqda' : (holat==='qabul qilingan' ? 'qabul' : 'rad');
    const turi = (r.turi||'muddat').toString().trim();
    const isMuddat = turi === 'muddat';
    const checked = selectedSorovIds.has(r.ID) ? 'checked' : '';
    const detailLine = isMuddat
      ? `So'ralgan: <b style="color:var(--text)">${escapeHtml(r.soat||'')} soat</b>`
      : `Sabab: <b style="color:var(--text)">${escapeHtml(r.sabab||'')}</b>`;
    return `
    <div class="sorov-card${isPending?' pending':''}">
      <input type="checkbox" class="sorov-check" data-id="${escapeHtml(r.ID)}" ${checked} onchange="toggleSorovSelect('${encodeURIComponent(r.ID)}', this.checked)">
      <div class="sorov-row">
        <div>
          <div class="ticket-tag" style="margin:0 0 6px 0">${isMuddat ? '🕐 Muddat so\'rovi' : '↩️ Qaytarish so\'rovi'}</div>
          <div class="ticket-code" style="font-size:14px"><span class="bar">${barcodeSpans(6)}</span>${escapeHtml(r.seria||'')}</div>
          <div class="ticket-sub">👤 ${escapeHtml(r.Ism||r.login||'')} · ${tumanLabel(r.tuman)}</div>
          <div class="ticket-sub">${detailLine} · ${escapeHtml(r.vaqt||'')}</div>
        </div>
      </div>
      <span class="sorov-status ${statusCls}">${holat==='kutilmoqda'?'Kutilmoqda':holat==='qabul qilingan'?'Qabul qilingan':'Rad etilgan'}</span>
      ${isPending ? `
      <div class="sorov-actions">
        <button class="big-btn primary" onclick="sorovQabul('${encodeURIComponent(r.ID)}')">✔ Ruxsat berish</button>
        <button class="big-btn ghost" onclick="sorovRad('${encodeURIComponent(r.ID)}')">✕ Rad etish</button>
      </div>` : ''}
    </div>`;
  }).join('');

  updateXabarlarToolbar();
}

const instSlotIds = ['instSlot1','instSlot2','instSlot3','instSlot4'];
let instFiles = [null,null,null,null];

function resetInstallSlots(){
  instFiles = [null,null,null,null];
  instSlotIds.forEach((id, idx)=>{
    const required = idx < 2;
    const slot = document.getElementById(id);
    slot.classList.remove('filled');
    slot.innerHTML = `<span class="${required?'req':'opt'}">${required?'Majburiy':'Ixtiyoriy'}</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/></svg><span>${idx+1}-rasm</span><input type="file" accept="image/*"></label>`;
    slot.querySelector('input').addEventListener('change', (e)=>onInstallFile(e, idx, required));
  });
}
async function onInstallFile(e, idx, required){
  const file = e.target.files[0];
  if(!file) return;
  const data = await fileToCompressedBase64(file, 1280);
  instFiles[idx] = data;
  const slot = document.getElementById(instSlotIds[idx]);
  slot.classList.add('filled');
  slot.innerHTML = `<img src="${data}"><span class="check">✓</span><input type="file" accept="image/*">`;
  slot.querySelector('input').addEventListener('change', (e2)=>onInstallFile(e2, idx, required));
}

let leafletMapInstance = null, leafletMarker = null, pickedLatLng = null, myLocationMarker = null;
const mapOverlay = document.getElementById('mapOverlay');
const locBtn = document.getElementById('locBtn');
const locateMeBtn = document.getElementById('locateMeBtn');
const DEFAULT_CENTER = [39.7747, 64.4286];

function resetLocation(){
  pickedLatLng = null;
  locBtn.textContent = '📍 Joylashuvni belgilash';
  locBtn.classList.remove('picked');
}

function updateCoordsText(lat, lng){
  document.getElementById('mapCoordsText').textContent = lat.toFixed(6) + ', ' + lng.toFixed(6);
}

let leafletLoadPromise = null;
function ensureLeafletLoaded(){
  if(window.L) return Promise.resolve();
  if(leafletLoadPromise) return leafletLoadPromise;
  leafletLoadPromise = new Promise((resolve, reject)=>{
    const cssLink = document.createElement('link');
    cssLink.rel = 'stylesheet';
    cssLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    document.head.appendChild(cssLink);

    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("Xarita kutubxonasini yuklab bo'lmadi. Internetni tekshiring."));
    document.head.appendChild(script);
  });
  return leafletLoadPromise;
}

function openMapPicker(){
  mapOverlay.classList.add('show');
  document.getElementById('mapCoordsText').textContent = 'Xarita yuklanmoqda...';
  ensureLeafletLoaded().then(initLeafletMap).catch(err=>{
    toast(err.message, 'error');
    mapOverlay.classList.remove('show');
  });
}

function initLeafletMap(){
  setTimeout(()=>{
    const startCenter = pickedLatLng ? [pickedLatLng.lat, pickedLatLng.lng] : DEFAULT_CENTER;
    if(!leafletMapInstance){
      leafletMapInstance = L.map('leafletMap').setView(startCenter, 15);
      const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap'
      }).addTo(leafletMapInstance);
      const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19, attribution: 'Tiles © Esri'
      });
      L.control.layers({ '🗺️ Xarita': streetLayer, '🛰️ Sputnik': satelliteLayer }, null, { position: 'topright', collapsed: false }).addTo(leafletMapInstance);
      L.control.scale({ position: 'bottomleft', metric: true, imperial: false }).addTo(leafletMapInstance);
      leafletMarker = L.marker(startCenter, { draggable: true }).addTo(leafletMapInstance);
      leafletMarker.on('dragend', ()=>{
        const p = leafletMarker.getLatLng();
        updateCoordsText(p.lat, p.lng);
      });
      leafletMapInstance.on('click', (e)=>{
        leafletMarker.setLatLng(e.latlng);
        updateCoordsText(e.latlng.lat, e.latlng.lng);
      });
    } else {
      leafletMapInstance.invalidateSize();
      leafletMapInstance.setView(startCenter, 15);
      leafletMarker.setLatLng(startCenter);
    }
    updateCoordsText(startCenter[0], startCenter[1]);

    if(!pickedLatLng && navigator.geolocation){
      document.getElementById('mapCoordsText').textContent = 'GPS orqali aniqlanmoqda...';
      navigator.geolocation.getCurrentPosition(
        (pos)=>{
          const c = [pos.coords.latitude, pos.coords.longitude];
          leafletMapInstance.setView(c, 16);
          leafletMarker.setLatLng(c);
          updateCoordsText(c[0], c[1]);
          showMyLocationDot(c);
        },
        ()=>{ updateCoordsText(startCenter[0], startCenter[1]); },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }
  }, 50);
}

function showMyLocationDot(latlng){
  if(!leafletMapInstance) return;
  const icon = L.divIcon({ className: 'my-location-dot', iconSize: [16,16] });
  if(myLocationMarker){
    myLocationMarker.setLatLng(latlng);
  } else {
    myLocationMarker = L.marker(latlng, { icon, interactive: false, zIndexOffset: 1000 }).addTo(leafletMapInstance);
  }
}

function locateMe(){
  if(!navigator.geolocation){ toast('Brauzeringiz joylashuvni aniqlay olmaydi', 'error'); return; }
  locateMeBtn.classList.add('loading');
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const c = [pos.coords.latitude, pos.coords.longitude];
      leafletMapInstance.setView(c, 17);
      showMyLocationDot(c);
      locateMeBtn.classList.remove('loading');
    },
    ()=>{
      toast("Joylashuvni aniqlab bo'lmadi — GPS ruxsatini tekshiring", 'error');
      locateMeBtn.classList.remove('loading');
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}
locateMeBtn.addEventListener('click', locateMe);

<script>
function restoreHtml(id){
  return document.getElementById(id).textContent.replace(/@@ENDSCRIPT@@/g, '<\/script');
}

const modules = {
  sn:    { frame: 'frameSn',    iframe: 'iframeSn',    loading: 'loadSn',    tpl: 'tpl-sn',    loaded: false },
  prof:  { frame: 'frameProf',  iframe: 'iframeProf',  loading: 'loadProf',  tpl: 'tpl-prof',  loaded: false },
  sklad: { frame: 'frameSklad', iframe: 'iframeSklad', loading: 'loadSklad', tpl: 'tpl-sklad', loaded: false }
};

function openModule(key){
  const m = modules[key];
  const frameEl = document.getElementById(m.frame);
  const iframeEl = document.getElementById(m.iframe);
  const loadEl = document.getElementById(m.loading);

  document.getElementById('hub').style.display = 'none';
  frameEl.classList.add('show');

  if(!m.loaded){
    loadEl.style.display = 'flex';
    iframeEl.addEventListener('load', function onLoad(){
      loadEl.style.display = 'none';
      iframeEl.removeEventListener('load', onLoad);
    });
    iframeEl.srcdoc = restoreHtml(m.tpl);
    m.loaded = true;
  }
}

function goHome(){
  Object.values(modules).forEach(m => document.getElementById(m.frame).classList.remove('show'));
  document.getElementById('hub').style.display = 'block';
}

document.getElementById('cardSn').addEventListener('click', ()=>openModule('sn'));
document.getElementById('cardProf').addEventListener('click', ()=>openModule('prof'));
document.getElementById('cardSklad').addEventListener('click', ()=>openModule('sklad'));

window.addEventListener('message', (e)=>{
  if(e && e.data && e.data.type === 'goHome') goHome();
});
</script>
