<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sklad Pro · iOS 27 Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ios-bg: #000000;
  --ios-glass: rgba(255, 255, 255, 0.07);
  --ios-glass-thick: rgba(255, 255, 255, 0.13);
  --ios-border: rgba(255, 255, 255, 0.14);
  --ios-border-hi: rgba(10, 132, 255, 0.5);
  --ios-accent: #0a84ff;
  --ios-accent-glow: rgba(10, 132, 255, 0.35);
  --ios-purple: #bf5af2;
  --ios-green: #30d158;
  --ios-orange: #ff9f0a;
  --ios-red: #ff453a;
  
  --text-main: #ffffff;
  --text-sub: rgba(235, 235, 245, 0.6);
  --mono: 'JetBrains Mono', monospace;
  --app-max-width: 430px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
html, body { height: 100%; margin: 0; padding: 0; background: var(--ios-bg); color: var(--text-main); }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  display: flex;
  justify-content: center;
  background: radial-gradient(1200px 800px at 50% -20%, #1a1a36 0%, #000000 100%) fixed;
  overflow-x: hidden;
}

.mono { font-family: var(--mono); }

/* Dynamic Island Header */
.dynamic-island-wrapper {
  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 28px); max-width: calc(var(--app-max-width) - 28px);
  z-index: 1000;
}

.dynamic-island {
  background: rgba(15, 15, 22, 0.85);
  backdrop-filter: blur(30px) saturate(210%); -webkit-backdrop-filter: blur(30px) saturate(210%);
  border: 1px solid var(--ios-border); border-radius: 28px;
  padding: 10px 18px; display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

.island-brand { display: flex; align-items: center; gap: 10px; }
.island-logo {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--ios-accent), var(--ios-purple));
  display: flex; align-items: center; justify-content: center; font-size: 15px;
  box-shadow: 0 0 14px var(--ios-accent-glow);
}
.island-title { font-size: 13.5px; font-weight: 700; }
.island-status { font-size: 10.5px; color: var(--ios-green); display: flex; align-items: center; gap: 4px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ios-green); box-shadow: 0 0 8px var(--ios-green); }

.icon-btn-round {
  background: rgba(255,255,255,0.08); border: 1px solid var(--ios-border);
  color: #fff; width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.icon-btn-round:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }

/* App Viewport */
.app-viewport {
  width: 100%; max-width: var(--app-max-width);
  padding: 84px 16px 120px; min-height: 100vh;
}

/* Login Screen Overlay */
.login-overlay {
  position: fixed; inset: 0; z-index: 3000;
  background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #000000 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
}
.login-card {
  width: 100%; max-width: 360px;
  background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px);
  border: 1px solid var(--ios-border); border-radius: 32px; padding: 30px 24px; text-align: center;
  box-shadow: 0 30px 70px rgba(0,0,0,0.8);
}

.field { margin-bottom: 14px; text-align: left; }
.field label { display: block; font-size: 11px; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
.field input, .field select {
  width: 100%; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--ios-border);
  border-radius: 16px; padding: 13px 15px; color: #fff; font-size: 14.5px; font-family: inherit;
}
.field input:focus, .field select:focus { border-color: var(--ios-accent); background: rgba(255, 255, 255, 0.12); }

/* Widgets */
.widget-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.ios-widget {
  background: var(--ios-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--ios-border); border-radius: 22px; padding: 14px 10px; text-align: center;
}
.ios-widget .val { font-size: 20px; font-weight: 800; font-family: var(--mono); }
.ios-widget .lbl { font-size: 9.5px; color: var(--text-sub); margin-top: 4px; font-weight: 600; text-transform: uppercase; }

/* Search Bar */
.search-container { position: relative; margin-bottom: 18px; }
.search-input {
  width: 100%; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--ios-border);
  border-radius: 18px; padding: 13px 16px 13px 44px; color: #fff; font-size: 14px; backdrop-filter: blur(15px);
}
.search-input:focus { border-color: var(--ios-accent); background: rgba(255, 255, 255, 0.1); }
.search-icon-svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-sub); pointer-events: none; }

/* Cards */
.card-flow { display: flex; flex-direction: column; gap: 14px; }
.ios-card {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
  backdrop-filter: blur(30px) saturate(190%); -webkit-backdrop-filter: blur(30px) saturate(190%);
  border: 1px solid var(--ios-border); border-radius: 26px; padding: 18px; position: relative;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.card-sn { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--ios-accent); letter-spacing: 0.5px; }
.card-sub { font-size: 12px; color: var(--text-sub); margin-top: 3px; font-weight: 500; }

.ios-tag {
  padding: 4px 10px; border-radius: 100px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; background: rgba(10, 132, 255, 0.15); color: var(--ios-accent);
  border: 1px solid rgba(10, 132, 255, 0.3);
}
.ios-tag.kogon { color: var(--ios-purple); border-color: rgba(191,90,242,0.3); background: rgba(191,90,242,0.15); }

.card-actions-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.ios-btn {
  flex: 1; padding: 12px; border-radius: 16px; border: 1px solid var(--ios-border);
  background: rgba(255, 255, 255, 0.08); color: #fff; font-size: 12.5px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.ios-btn-primary { background: linear-gradient(135deg, var(--ios-accent), #0056b3); border: none; box-shadow: 0 6px 20px var(--ios-accent-glow); }
.ios-btn-danger { background: rgba(255, 69, 58, 0.15); border-color: rgba(255, 69, 58, 0.3); color: var(--ios-red); }
.ios-btn-warn { background: rgba(255, 159, 10, 0.15); border-color: rgba(255, 159, 10, 0.3); color: var(--ios-orange); }
.ios-btn:active { transform: scale(0.96); opacity: 0.8; }
.ios-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Floating Dock */
.dock-wrapper {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 28px); max-width: calc(var(--app-max-width) - 28px); z-index: 1000;
}
.ios-dock {
  background: rgba(20, 20, 28, 0.75); backdrop-filter: blur(35px) saturate(210%); -webkit-backdrop-filter: blur(35px) saturate(210%);
  border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 32px; padding: 6px 10px;
  display: flex; justify-content: space-around; box-shadow: 0 25px 60px rgba(0,0,0,0.8);
}
.dock-item {
  background: transparent; border: none; color: var(--text-sub); padding: 8px 14px;
  border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 9.5px; font-weight: 600; cursor: pointer; position: relative;
}
.dock-item.active { color: #fff; background: rgba(255, 255, 255, 0.12); }
.dock-item .badge-cnt {
  position: absolute; top: 2px; right: 8px; background: var(--ios-purple); color: #fff;
  font-size: 9px; font-weight: 800; border-radius: 100px; padding: 1px 5px;
}

/* Sheet Modal */
.sheet-overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(12px);
  z-index: 2500; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet-overlay.active { opacity: 1; pointer-events: auto; }
.bottom-sheet {
  background: rgba(22, 22, 28, 0.95); backdrop-filter: blur(40px);
  border: 1px solid var(--ios-border); border-radius: 36px 36px 0 0;
  width: 100%; max-width: var(--app-max-width); padding: 22px; max-height: 88vh; overflow-y: auto;
  transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
.sheet-overlay.active .bottom-sheet { transform: translateY(0); }
.sheet-handle { width: 38px; height: 5px; background: rgba(255, 255, 255, 0.25); border-radius: 100px; margin: 0 auto 16px; }

/* Toast */
.toast {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 4000;
  background: rgba(255,255,255,0.18); backdrop-filter: blur(25px); border: 1px solid var(--ios-border);
  padding: 12px 20px; border-radius: 100px; font-size: 13px; font-weight: 600; color: #fff;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- Login Screen Overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div style="font-size:36px; margin-bottom:10px;">📦</div>
    <h2 style="margin:0 0 6px; font-size:20px;">Sklad CRM Login</h2>
    <p style="margin:0 0 20px; font-size:12px; color:var(--text-sub);">Google Apps Script orqali kirish</p>
    
    <div class="field">
      <label>Apps Script Web App URL</label>
      <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div class="field"><label>Login</label><input type="text" id="loginInput" placeholder="Masalan: admin"></div>
    <div class="field"><label>Parol</label><input type="password" id="passInput"></div>
    
    <button class="ios-btn ios-btn-primary" style="width:100%; padding:14px; margin-top:10px;" id="loginBtn" onclick="doLogin()">Kirish</button>
  </div>
</div>

<!-- Header -->
<div class="dynamic-island-wrapper">
  <div class="dynamic-island">
    <div class="island-brand">
      <div class="island-logo">📦</div>
      <div>
        <div class="island-title" id="userName">Sklad Pro</div>
        <div class="island-status"><span class="status-dot"></span> Onlayn · Cloud Sync</div>
      </div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="icon-btn-round" onclick="refreshData()" title="Yangilash">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
      </button>
      <button class="icon-btn-round" onclick="doLogout()" title="Chiqish" style="color:var(--ios-red);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- App Viewport -->
<div class="app-viewport">
  <div class="widget-grid">
    <div class="ios-widget">
      <div class="val" style="color:var(--ios-accent)" id="statSklad">0</div>
      <div class="lbl">Skladda</div>
    </div>
    <div class="ios-widget">
      <div class="val" style="color:var(--ios-purple)" id="statMening">0</div>
      <div class="lbl">Mening</div>
    </div>
    <div class="ios-widget">
      <div class="val" style="color:var(--ios-green)" id="statChiqim">0</div>
      <div class="lbl">O'rnatilgan</div>
    </div>
  </div>

  <div class="search-container">
    <svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" class="search-input" id="searchInput" oninput="renderCurrentTab()" placeholder="S/N bo'yicha qidirish...">
  </div>

  <div class="card-flow" id="cardContainer">
    <div style="text-align:center; padding:40px; color:var(--text-sub);">Tizimga kiring...</div>
  </div>
</div>

<!-- Bottom Dock -->
<div class="dock-wrapper">
  <div class="ios-dock">
    <button class="dock-item active" id="dockSklad" onclick="setTab('sklad')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
      Sklad
    </button>
    <button class="dock-item" id="dockMening" onclick="setTab('mening')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.4 14.5 16 10 4 20"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
      Mening
      <span class="badge-cnt" id="cntMening" style="display:none">0</span>
    </button>
    <button class="dock-item" id="dockChiqim" onclick="setTab('chiqim')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      Tarix
    </button>
    <button class="dock-item" id="dockSorov" onclick="setTab('sorov')" style="display:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Xabarlar
      <span class="badge-cnt" id="cntSorov" style="display:none">0</span>
    </button>
  </div>
</div>

<!-- Bottom Sheet -->
<div class="sheet-overlay" id="sheetModal" onclick="closeSheet(event)">
  <div class="bottom-sheet" id="sheetContent"></div>
</div>

<script>
var API_URL = localStorage.getItem('sklad_api_url') || '';
var currentUser = JSON.parse(localStorage.getItem('sklad_user') || 'null');
var db = { employees:[], sklad:[], kirim:[], chiqim:[], sorovlar:[], tugaganlar:[] };
var activeTab = 'sklad';

window.onload = function() {
  if (API_URL) document.getElementById('apiUrlInput').value = API_URL;
  
  if (currentUser && API_URL) {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('userName').innerText = currentUser.ISM + " (" + currentUser.tuman + ")";
    if (currentUser.dostup === 'admin') document.getElementById('dockSorov').style.display = 'flex';
    refreshData();
  } else {
    document.getElementById('loginOverlay').style.display = 'flex';
  }
};

function showToast(msg) {
  var t = document.getElementById('toast');
  t.innerText = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

// Google Apps Script bilan xavfsiz so'rov
function apiRequest(action, payload) {
  return new Promise(function(resolve, reject) {
    var url = API_URL + (API_URL.indexOf('?') > -1 ? '&' : '?') + "action=" + action + "&t=" + Date.now();
    
    if (!payload) {
      fetch(url)
        .then(function(r){ return r.json(); })
        .then(resolve)
        .catch(reject);
    } else {
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(function(r){ return r.json(); })
      .then(resolve)
      .catch(reject);
    }
  });
}

function doLogin() {
  var url = document.getElementById('apiUrlInput').value.trim();
  var log = document.getElementById('loginInput').value.trim();
  var pas = document.getElementById('passInput').value.trim();
  
  if (!url || !log || !pas) return showToast("Barcha maydonlarni to'ldiring!");
  
  API_URL = url;
  localStorage.setItem('sklad_api_url', API_URL);
  
  showToast("Tekshirilmoqda...");
  apiRequest('bootstrap')
    .then(function(res){
      if (!res.employees) {
        return showToast("Javob o'qilmadi! URL to'g'riligini tekshiring.");
      }
      var user = res.employees.find(function(u){ 
        return String(u.LOGIN).trim() === log && String(u.PAROL).trim() === pas; 
      });
      
      if (!user) return showToast("Login yoki parol xato!");
      
      currentUser = user;
      localStorage.setItem('sklad_user', JSON.stringify(user));
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('userName').innerText = currentUser.ISM + " (" + currentUser.tuman + ")";
      if (currentUser.dostup === 'admin') document.getElementById('dockSorov').style.display = 'flex';
      
      db = res;
      updateStats();
      renderCurrentTab();
      showToast("Xush kelibsiz!");
    })
    .catch(function(err){
      showToast("API manzilga ulanib bo'lmadi!");
    });
}

function doLogout() {
  localStorage.removeItem('sklad_user');
  location.reload();
}

function refreshData() {
  if (!API_URL) return;
  apiRequest('bootstrap').then(function(res){
    db = res;
    updateStats();
    renderCurrentTab();
  }).catch(function(){ showToast("Ma'lumot yangilanmadi"); });
}

function updateStats() {
  document.getElementById('statSklad').innerText = db.sklad ? db.sklad.length : 0;
  var myKirim = (db.kirim || []).filter(function(k){ return k.login === currentUser.LOGIN; });
  document.getElementById('statMening').innerText = myKirim.length;
  document.getElementById('statChiqim').innerText = db.chiqim ? db.chiqim.length : 0;
  
  var cntM = document.getElementById('cntMening');
  if (myKirim.length > 0) { cntM.innerText = myKirim.length; cntM.style.display = 'block'; } 
  else cntM.style.display = 'none';

  if (currentUser.dostup === 'admin') {
    var pending = (db.sorovlar || []).filter(function(s){ return s.holat === 'kutilmoqda'; });
    var cntS = document.getElementById('cntSorov');
    if (pending.length > 0) { cntS.innerText = pending.length; cntS.style.display = 'block'; } 
    else cntS.style.display = 'none';
  }
}

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.dock-item').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('dock' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  renderCurrentTab();
}

function renderCurrentTab() {
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  var html = '';

  if (activeTab === 'sklad') {
    var items = (db.sklad || []).filter(function(i){ 
      return (i["S/N"]||'').toLowerCase().includes(q) || (i.marka||'').toLowerCase().includes(q); 
    });
    items.forEach(function(item){
      html += '<div class="ios-card"><div class="card-top"><div><div class="card-sn">' + item["S/N"] + '</div><div class="card-sub">' + (item.marka||'Marka yo\'q') + '</div></div><span class="ios-tag ' + (item.tuman||'').toLowerCase() + '">' + item.tuman + '</span></div><div class="card-actions-row"><button class="ios-btn ios-btn-primary" onclick="openOlishSheet(\'' + item["S/N"] + '\')">Olish</button></div></div>';
    });
  } else if (activeTab === 'mening') {
    var items = (db.kirim || []).filter(function(i){ 
      return (currentUser.dostup==='admin' || i.login===currentUser.LOGIN) && ((i["S/N"]||'').toLowerCase().includes(q)); 
    });
    items.forEach(function(item){
      html += '<div class="ios-card"><div class="card-top"><div><div class="card-sn">' + item["S/N"] + '</div><div class="card-sub">' + item.marka + ' · ' + item.manzil + '</div></div><span class="ios-tag">' + (item.sana||'') + '</span></div><div class="card-actions-row"><button class="ios-btn ios-btn-primary" onclick="openChiqimSheet(\'' + item["S/N"] + '\')">O\'rnatdim</button><button class="ios-btn ios-btn-warn" onclick="openMuddatSheet(\'' + item["S/N"] + '\')">+Muddat</button></div></div>';
    });
  } else if (activeTab === 'chiqim') {
    var items = (db.chiqim || []).filter(function(i){ return (i["S/N"]||'').toLowerCase().includes(q); });
    items.forEach(function(item){
      html += '<div class="ios-card"><div class="card-top"><div><div class="card-sn">' + item["S/N"] + '</div><div class="card-sub">' + item.marka + ' · ' + item.manzil + ' (' + (item.Ism||'') + ')</div></div><span class="ios-tag">' + item.sana + '</span></div></div>';
    });
  } else if (activeTab === 'sorov' && currentUser.dostup==='admin') {
    (db.sorovlar || []).forEach(function(s){
      html += '<div class="ios-card"><div class="card-top"><div><div class="card-sn">' + (s.turi||'').toUpperCase() + ': ' + s.seria + '</div><div class="card-sub">Xodim: ' + s.Ism + ' (' + s.tuman + ')</div></div><span class="ios-tag">' + s.holat + '</span></div>';
      if (s.holat === 'kutilmoqda') {
        html += '<div class="card-actions-row"><button class="ios-btn ios-btn-primary" onclick="processSorov(\'' + s.ID + '\', \'qabul\')">Qabul qilish</button><button class="ios-btn ios-btn-danger" onclick="processSorov(\'' + s.ID + '\', \'rad\')">Rad etish</button></div>';
      }
      html += '</div>';
    });
  }

  document.getElementById('cardContainer').innerHTML = html || '<div style="text-align:center; padding:40px; color:var(--text-sub);">Qurilmalar topilmadi</div>';
}

function closeSheet(e) {
  if (!e || e.target.classList.contains('sheet-overlay')) {
    document.getElementById('sheetModal').classList.remove('active');
  }
}

function openOlishSheet(seria) {
  var html = '<div class="sheet-handle"></div><h3 style="margin:0 0 14px;">Qurilmani olish: ' + seria + '</h3>' +
    '<div class="field"><label>Obyekt Manzili</label><input type="text" id="olishManzil"></div>' +
    '<div class="field"><label>Muddat (Soat)</label><select id="olishMuddat"><option value="24">24 Soat (1 kun)</option><option value="48">48 Soat (2 kun)</option><option value="72">72 Soat (3 kun)</option></select></div>' +
    '<button class="ios-btn ios-btn-primary" id="btnSubmitOlish" style="width:100%; padding:14px;" onclick="submitOlish(\'' + seria + '\')">Tasdiqlash va Olish</button>';
  
  document.getElementById('sheetContent').innerHTML = html;
  document.getElementById('sheetModal').classList.add('active');
}

function submitOlish(seria) {
  var manzil = document.getElementById('olishManzil').value.trim();
  var muddat = document.getElementById('olishMuddat').value;
  if (!manzil) return showToast("Manzilni kiriting!");

  var btn = document.getElementById('btnSubmitOlish');
  btn.disabled = true; btn.innerText = "Yuborilmoqda...";

  apiRequest('post', {
    action: 'olish', seria: seria, login: currentUser.LOGIN, ism: currentUser.ISM,
    role: currentUser.dostup, tuman: currentUser.tuman, manzil: manzil,
    muddat_soat: muddat
  }).then(function(res){
    document.getElementById('sheetModal').classList.remove('active');
    if (res.success) { showToast("Qurilma muvaffaqiyatli olindi!"); refreshData(); }
    else showToast(res.error || "Xatolik yuz berdi");
  }).catch(function(){ btn.disabled = false; showToast("Serverga bog'lanishda xato"); });
}

function openChiqimSheet(seria) {
  var html = '<div class="sheet-handle"></div><h3 style="margin:0 0 14px;">O\'rnatishni tasdiqlash: ' + seria + '</h3>' +
    '<div class="field"><label>OLT</label><input type="text" id="chOLT"></div>' +
    '<div class="field"><label>Port</label><input type="text" id="chPort"></div>' +
    '<div class="field"><label>Masofa (m)</label><input type="text" id="chMasofa"></div>' +
    '<button class="ios-btn ios-btn-primary" id="btnSubmitChiqim" style="width:100%; padding:14px;" onclick="submitChiqim(\'' + seria + '\')">O\'rnatildi Deb Saqlash</button>';
  
  document.getElementById('sheetContent').innerHTML = html;
  document.getElementById('sheetModal').classList.add('active');
}

function submitChiqim(seria) {
  var olt = document.getElementById('chOLT').value.trim();
  var port = document.getElementById('chPort').value.trim();
  var masofa = document.getElementById('chMasofa').value.trim();
  
  if (!olt || !port) return showToast("OLT va Portni kiriting!");

  var btn = document.getElementById('btnSubmitChiqim');
  btn.disabled = true; btn.innerText = "Saqlanmoqda...";

  apiRequest('post', {
    action: 'chiqim', seria: seria, olt: olt, port: port, masofa: masofa,
    login: currentUser.LOGIN, ism: currentUser.ISM, tuman: currentUser.tuman
  }).then(function(res){
    document.getElementById('sheetModal').classList.remove('active');
    if (res.success) { showToast("O'rnatildi va Telegramga yuborildi!"); refreshData(); }
    else showToast(res.error || "Xatolik");
  }).catch(function(){ btn.disabled = false; showToast("Xatolik yuz berdi"); });
}

function openMuddatSheet(seria) {
  var html = '<div class="sheet-handle"></div><h3 style="margin:0 0 14px;">Muddat So\'rash: ' + seria + '</h3>' +
    '<div class="field"><label>Qo\'shimcha Soat (Max 24)</label><input type="number" id="mSoat" value="12"></div>' +
    '<div class="field"><label>Sabab</label><input type="text" id="mSabab"></div>' +
    '<button class="ios-btn ios-btn-warn" style="width:100%; padding:14px;" onclick="submitMuddat(\'' + seria + '\')">So\'rov Yuborish</button>';
  document.getElementById('sheetContent').innerHTML = html;
  document.getElementById('sheetModal').classList.add('active');
}

function submitMuddat(seria) {
  var soat = document.getElementById('mSoat').value;
  var sabab = document.getElementById('mSabab').value.trim();

  apiRequest('post', {
    action: 'sorov_yuborish', turi: 'muddat', seria: seria, login: currentUser.LOGIN,
    ism: currentUser.ISM, tuman: currentUser.tuman, soat: soat, sabab: sabab
  }).then(function(res){
    document.getElementById('sheetModal').classList.remove('active');
    if (res.success) { showToast("So'rov adminga yuborildi"); refreshData(); }
    else showToast(res.error || "Xatolik");
  });
}

function processSorov(id, javob) {
  apiRequest('post', { action: 'sorov_tasdiqlash', id: id, javob: javob }).then(function(res){
    showToast("So'rov saqlandi");
    refreshData();
  });
}
</script>
