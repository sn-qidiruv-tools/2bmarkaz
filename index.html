<!DOCTYPE html>
<html lang="uz">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabel Ombor Tizimi</title>
<style>
:root{
  --navy:#0f1e3d; --navy-2:#16294f; --navy-3:#1e3a5f;
  --blue:#2563eb; --blue-dark:#1d4ed8; --blue-light:#eff6ff;
  --bg:#f4f6fb; --card:#ffffff; --border:#e6e9f0; --text:#1f2937; --muted:#6b7280;
  --green:#22c55e; --yellow:#eab308; --orange:#f97316; --red:#ef4444;
  --radius:14px; --shadow:0 2px 10px rgba(20,30,60,.06), 0 1px 2px rgba(20,30,60,.04);
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#c7cede;border-radius:8px;}

/* ---------- LOADING ---------- */
#loading-screen{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;flex-direction:column;gap:14px;z-index:999;}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- AUTH SCREENS ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--navy-3));padding:20px;}
.auth-card{background:#fff;border-radius:20px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.auth-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--navy-3));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.auth-title{text-align:center;font-size:20px;font-weight:700;margin:0 0 4px;}
.auth-sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 24px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:.15s;background:#fbfcfe;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);background:#fff;}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:.15s;}
.btn-primary{background:var(--blue);color:#fff;width:100%;}
.btn-primary:hover{background:var(--blue-dark);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;}
.btn-outline{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
.btn-danger{background:#fff;color:var(--red);border:1.5px solid var(--red);}
.btn-ghost{background:transparent;color:var(--muted);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.auth-error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px;display:none;}

/* ---------- APP SHELL ---------- */
#app-shell{display:none;min-height:100vh;}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:230px;background:linear-gradient(180deg,var(--navy),var(--navy-2));color:#cfd8ef;padding:20px 14px;display:flex;flex-direction:column;z-index:50;transition:.2s;}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:6px 8px 22px;color:#fff;font-weight:700;font-size:15px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#c7d0e8;text-decoration:none;font-size:13.6px;font-weight:500;cursor:pointer;margin-bottom:3px;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--blue);color:#fff;}
.nav-icon{width:18px;text-align:center;}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}
.main{margin-left:230px;min-height:100vh;display:flex;flex-direction:column;}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:30;}
.topbar-title{font-size:17px;font-weight:700;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.lang-toggle{display:flex;background:var(--bg);border-radius:8px;padding:3px;}
.lang-btn{border:none;background:transparent;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);}
.lang-btn.active{background:#fff;color:var(--blue);box-shadow:var(--shadow);}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--bg);padding:6px 12px 6px 6px;border-radius:20px;font-size:13px;font-weight:600;position:relative;cursor:pointer;}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.user-menu{position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);min-width:170px;display:none;overflow:hidden;z-index:60;}
.user-menu.open{display:block;}
.user-menu button{width:100%;text-align:left;padding:10px 14px;border:none;background:none;font-size:13px;color:var(--text);}
.user-menu button:hover{background:var(--bg);}
#page-content{padding:22px 24px 60px;flex:1;}
.page{display:none;}
.page.active{display:block;}

/* ---------- CARDS / GRID ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px;}
.stat-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);}
.stat-card .label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.stat-card .value{font-size:26px;font-weight:800;margin-top:6px;}
.stat-card .icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:10px;}
.section-card{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:18px;}
.section-title{font-size:15px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

.drum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
.drum-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:.15s;position:relative;}
.drum-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,30,60,.1);}
.drum-id{font-weight:700;font-size:13.5px;}
.drum-type{font-size:11.5px;color:var(--muted);margin-bottom:10px;}
.ring-wrap{position:relative;width:112px;height:112px;border-radius:50%;margin:4px 0 10px;}
.ring-center{position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fdfefe,#eef1f6 70%);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 5px rgba(20,30,60,.15),inset 0 -2px 4px rgba(255,255,255,.6);}
.ring-percent{font-size:16px;font-weight:800;position:relative;z-index:2;}
.drum-meters{font-size:11.5px;color:var(--muted);margin-top:2px;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;margin-top:8px;}
.badge-good{background:#dcfce7;color:#15803d;}
.badge-medium{background:#fef9c3;color:#854d0e;}
.badge-low{background:#ffedd5;color:#c2410c;}
.badge-critical{background:#fee2e2;color:#b91c1c;}

.reel-svg{width:44px;height:44px;position:relative;z-index:1;}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 10px;background:var(--bg);color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.empty-state{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;justify-content:space-between;}
.toolbar-left{display:flex;gap:10px;flex-wrap:wrap;}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}

.usage-row{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;}
.usage-total{background:var(--blue-light);border:1px solid #bfdbfe;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:700;color:var(--blue-dark);margin-top:8px;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal-box{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:24px;}
.modal-box.wide{max-width:720px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{margin:0;font-size:16.5px;}
.close-x{border:none;background:var(--bg);width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--muted);}

/* Toast */
#toast-root{position:fixed;bottom:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 16px;border-radius:10px;color:#fff;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);min-width:220px;animation:slideIn .2s ease;}
.toast-success{background:#16a34a;} .toast-error{background:#dc2626;} .toast-info{background:var(--navy-3);}
@keyframes slideIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

.history-item{border-left:3px solid var(--blue);padding:8px 0 8px 12px;margin-bottom:8px;font-size:12.5px;}
.history-item .h-top{font-weight:700;}
.history-item .h-meta{color:var(--muted);font-size:11.5px;margin-top:2px;}

@media(max-width:800px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .usage-row{grid-template-columns:1fr;}
}
.mobile-menu-btn{display:none;border:none;background:var(--bg);width:36px;height:36px;border-radius:9px;font-size:16px;}
@media(max-width:800px){.mobile-menu-btn{display:block;}}
  </style>
</head>
<body>

<div id="loading-screen"><div class="spinner"></div><div id="loading-text">Yuklanmoqda...</div></div>

<!-- FIRST-RUN ADMIN SETUP -->
<div id="setup-screen" class="auth-wrap" style="display:none;">
  <div class="auth-card">
    <div class="auth-logo">🔧</div>
    <p class="auth-title">Birinchi admin yaratish</p>
    <p class="auth-sub">Tizimda hali foydalanuvchi yo'q. Boshqaruvchi (Admin) hisobini yarating.</p>
    <div class="auth-error" id="setup-error"></div>
    <div class="field"><label>Login</label><input id="setup-login" placeholder="masalan: admin"></div>
    <div class="field"><label>Parol (kamida 8 belgi)</label><input id="setup-password" type="password"></div>
    <div class="field"><label>Parolni tasdiqlang</label><input id="setup-password2" type="password"></div>
    <button class="btn btn-primary" id="setup-submit-btn" onclick="doFirstAdminSetup()">Admin yaratish</button>
  </div>
</div>

<!-- LOGIN -->
<div id="login-screen" class="auth-wrap" style="display:none;">
  <div class="auth-card">
    <div class="auth-logo">🔌</div>
    <p class="auth-title">Kabel Ombor Tizimi</p>
    <p class="auth-sub">Tizimga kirish uchun login va parolingizni kiriting</p>
    <div class="auth-error" id="login-error"></div>
    <div class="field"><label>Login</label><input id="login-login" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="field"><label>Parol</label><input id="login-password" type="password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-primary" id="login-submit-btn" onclick="doLogin()">Kirish</button>
  </div>
</div>

<!-- APP SHELL -->
<div id="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">🔌 <span>Kabel Ombor</span></div>
    <div id="nav-list"></div>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="doLogout()" style="width:100%;border:none;background:none;">
        <span class="nav-icon">🚪</span><span data-t="logout">Chiqish</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div class="topbar-title" id="page-title-text">—</div>
      </div>
      <div class="topbar-right">
        <div class="lang-toggle">
          <button class="lang-btn" id="lang-uz" onclick="setLang('uz')">UZ</button>
          <button class="lang-btn" id="lang-ru" onclick="setLang('ru')">RU</button>
        </div>
        <div class="user-chip" onclick="document.getElementById('user-menu').classList.toggle('open')">
          <div class="user-avatar" id="user-avatar">?</div>
          <span id="user-chip-name">—</span>
          <div class="user-menu" id="user-menu">
            <button onclick="openChangePasswordModal()">🔑 <span data-t="changePassword">Parolni o'zgartirish</span></button>
            <button onclick="doLogout()">🚪 <span data-t="logout">Chiqish</span></button>
          </div>
        </div>
      </div>
    </div>

    <main id="page-content">
      <section class="page" id="page-dashboard"></section>
      <section class="page" id="page-drums"></section>
      <section class="page" id="page-cabletypes"></section>
      <section class="page" id="page-usage"></section>
      <section class="page" id="page-reports"></section>
      <section class="page" id="page-users"></section>
      <section class="page" id="page-settings"></section>
    </main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>


<script>

function t(key){ return (T[STATE.lang] && T[STATE.lang][key]) || key; }

/* ============================================================
   SERVER API (fetch orqali Apps Script Web App'ga so'rov) — Promise
   ============================================================ */
// Bu yerga Apps Script Web App deploy qilingandan keyingi /exec havolasini qo'ying

function call(fnName, args){
  return fetch(API_URL, {
    method: 'POST',
    // MUHIM: Content-Type ni 'application/json' qilib QO'YMANG — aks holda
    // brauzer CORS preflight (OPTIONS) so'rov yuboradi va Apps Script uni tushunmaydi.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fnName, args: args || [] })
  })
  .then(function(res){
    if (!res.ok) throw new Error('Server xatosi: HTTP ' + res.status);
    return res.json();
  })
  .then(function(data){
    if (!data.success) throw new Error(data.error || "Noma'lum xatolik");
    return data.result;
  });
}
function authCall(fnName, args){
  args = args || [];
  return call(fnName, [STATE.token].concat(args)).catch(function(err){
    const msg = (err && err.message) || String(err);
    if (msg.indexOf('SESSIYA_TUGAGAN') !== -1) {
      toast(t('loading') === 'Загрузка...' ? 'Сессия истекла, войдите снова' : 'Sessiya tugagan, qaytadan kiring', 'error');
      hardLogout();
      throw err;
    }
    throw err;
  });
}

/* ============================================================

   ============================================================ */
function toast(msg, type){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast toast-' + (type || 'info');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function(){ el.remove(); }, 4200);
}
function showErr(elId, err){
  const box = document.getElementById(elId);
  box.textContent = (err && err.message) ? err.message : String(err);
  box.style.display = 'block';
}

window.addEventListener('DOMContentLoaded', boot);

function boot(){
  if (STATE.token) {
    call('checkSession', [STATE.token]).then(function(res){

        enterApp();
      } else {

    document.getElementById('login-screen').style.display = 'flex';

function doLogin(){
  const login = document.getElementById('login-login').value.trim();
  const pass = document.getElementById('login-password').value;
  document.getElementById('login-error').style.display = 'none';
  const btn = document.getElementById('login-submit-btn'); btn.disabled = true;
  call('login', [login, pass]).then(function(res){
    STATE.token = res.token;
    STATE.user = res.user;
    localStorage.setItem('kabelombor_token', res.token);
    document.getElementById('login-screen').style.display = 'none';

function hardLogout(){

function levelColor(level){
  return { good:'var(--green)', medium:'var(--yellow)', low:'var(--orange)', critical:'var(--red)' }[level] || 'var(--green)';
}
function levelLabel(level){
  return { good:t('good'), medium:t('medium'), low:t('low'), critical:t('critical') }[level] || '';
}
function reelSvg(){
  return '<svg class="reel-svg" viewBox="0 0 100 100">' +
    '<defs><radialGradient id="reelGrad" cx="35%" cy="30%" r="75%">' +
    '<stop offset="0%" stop-color="#9fb3d1"/>' +
    '<stop offset="55%" stop-color="#5c7aa8"/><stop offset="100%" stop-color="#2c3f5e"/></radialGradient></defs>' +
    '<circle cx="50" cy="50" r="46" fill="url(#reelGrad)"/>' +
    '<circle cx="50" cy="50" r="46" fill="none" stroke="#1e3a5f" stroke-width="3"/>' +
    '<circle cx="50" cy="50" r="30" fill="#e9edf5" stroke="#c3ccdd" stroke-width="2"/>' +
    '<circle cx="50" cy="50" r="9" fill="#1e3a5f"/>' +
    '<g stroke="#c3ccdd" stroke-width="2">' +
    '<line x1="50" y1="20" x2="50" y2="35"/><line x1="50" y1="65" x2="50" y2="80"/>' +
    '<line x1="20" y1="50" x2="35" y2="50"/><line x1="65" y1="50" x2="80" y2="50"/>' +
    '</g></svg>';
}
function drumCardHtml(d){
  const color = levelColor(d.level);
  const ringStyle = 'background:conic-gradient(' + color + ' ' + Math.max(d.percent,0) + '%, #e5e9f1 0);';
  return '<div class="drum-card" onclick="openDrumDetail(\'' + d.Baraban_ID + '\')">' +
    '<div class="drum-id">' + d.Baraban_ID + '</div>' +
    '<div class="drum-type">' + escapeHtml(d.Kabel_nomi) + (d.Baraban_raqami ? ' · #' + escapeHtml(d.Baraban_raqami) : '') + '</div>' +
    '<div class="ring-wrap" style="' + ringStyle + '">' +
      '<div class="ring-center">' + reelSvg() +
        '<div style="position:absolute;bottom:-2px;background:#fff;border-radius:8px;padding:1px 6px;box-shadow:var(--shadow);">' +
          '<span class="ring-percent" style="font-size:12px;">' + d.percent + '%</span></div>' +
      '</div></div>' +
    '<div class="drum-meters">' + d.Qolgan_metr + ' / ' + d.Boshlangich_metr + ' m</div>' +
    '<span class="badge badge-' + d.level + '">' + levelLabel(d.level) + '</span>' +
  '</div>';
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtDate(v){
  if (!v) return '-';
  try { const d = new Date(v); if (isNaN(d)) return String(v); return d.toLocaleDateString(STATE.lang === 'ru' ? 'ru-RU' : 'uz-UZ'); }
  catch(e){ return String(v); }
}
function fmtDateTime(v){
  if (!v) return '-';
  try { const d = new Date(v); if (isNaN(d)) return String(v); return d.toLocaleString(STATE.lang === 'ru' ? 'ru-RU' : 'uz-UZ'); }
  catch(e){ return String(v); }
}

/* ---- Oddiy canvas grafiklar (tashqi kutubxonasiz) ---- */
function drawLineChart(canvasId, labels, values){
  const c = document.getElementById(canvasId); if (!c) return;
  const ctx = c.getContext('2d');
  const w = c.width = c.clientWidth; const h = c.height = 150;
  ctx.clearRect(0,0,w,h);
  const max = Math.max.apply(null, values.concat([1])) * 1.15;
  const padL = 30, padB = 20, padT = 10, padR = 10;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  ctx.strokeStyle = '#e6e9f0'; ctx.lineWidth = 1;
  for (let i=0;i<=3;i++){ const y = padT + plotH - (plotH*i/3); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke(); }
  ctx.beginPath();
  values.forEach(function(v,i){
    const x = padL + (plotW * i/(Math.max(values.length-1,1)));
    const y = padT + plotH - (v/max*plotH);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2.4; ctx.stroke();
  ctx.lineTo(padL+plotW, padT+plotH); ctx.lineTo(padL, padT+plotH); ctx.closePath();
  ctx.fillStyle = 'rgba(37,99,235,.08)'; ctx.fill();
  ctx.fillStyle = '#9aa4b8'; ctx.font = '10px sans-serif';
  labels.forEach(function(l,i){
    if (i % Math.ceil(labels.length/6) !== 0) return;
    const x = padL + (plotW * i/(Math.max(labels.length-1,1)));
    ctx.fillText(l.slice(5), x-12, h-4);
  });
}
function drawBarChart(canvasId, labels, values){
  const c = document.getElementById(canvasId); if (!c) return;
  const ctx = c.getContext('2d');
  const w = c.width = c.clientWidth; const h = c.height = 150;
  ctx.clearRect(0,0,w,h);
  if (!labels.length){ ctx.fillStyle = '#9aa4b8'; ctx.font='12px sans-serif'; ctx.fillText(t('noData'), 10, 30); return; }
  const max = Math.max.apply(null, values.concat([1])) * 1.15;
  const padL = 10, padB = 30, padT = 10;
  const barW = (w - padL*2) / labels.length * 0.6;
  const gap = (w - padL*2) / labels.length;
  ctx.fillStyle = '#9aa4b8'; ctx.font = '10px sans-serif';
  values.forEach(function(v,i){
    const barH = (h-padT-padB) * (v/max);
    const x = padL + gap*i + (gap-barW)/2;
    const y = h - padB - barH;
    ctx.fillStyle = '#2563eb';
    ctx.fillRect(x,y,barW,barH);
    ctx.fillStyle = '#6b7280';
    const lbl = String(labels[i]).length > 8 ? String(labels[i]).slice(0,8)+'…' : labels[i];
    ctx.fillText(lbl, x, h-14);
    ctx.fillText(String(v), x, y-4);
  });
}

function renderUsagePage(){
  const el = document.getElementById('page-usage');
  el.innerHTML = '<div class="section-card" style="max-width:640px;">' +
    '<div class="field"><label>' + t('workDate') + '</label><input id="us-date" type="date" value="' + new Date().toISOString().slice(0,10) + '"></div>' +
    '<div class="field"><label>' + t('projectName') + '</label><input id="us-project"></div>' +
    '<div class="field"><label>' + t('employees') + '</label><input id="us-employees"></div>' +
    '<div class="field"><label>' + t('address') + '</label><input id="us-address"></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
      '<div class="field"><label>' + t('latitude') + '</label><input id="us-lat" type="text" placeholder="41.31"></div>' +
      '<div class="field"><label>' + t('longitude') + '</label><input id="us-lng" type="text" placeholder="69.24"></div>' +
    '</div>' +
    '<div class="field"><label>' + t('note') + '</label><textarea id="us-note" rows="2"></textarea></div>' +
    '<div style="font-weight:700;font-size:13px;margin:14px 0 6px;">' + t('drums') + '</div>' +
    '<div id="us-rows"></div>' +
    '<button class="btn btn-outline btn-sm" onclick="addUsageRow()">➕ ' + t('addDrumRow') + '</button>' +
    '<div class="usage-total" id="us-total">' + t('totalToUse') + ': 0 m</div>' +
    '<div class="auth-error" id="us-error"></div>' +
    '<button class="btn btn-primary" id="us-submit-btn" style="width:100%;margin-top:12px;" onclick="submitUsage()">💾 ' + t('submitUsage') + '</button>' +
  '</div>';

  authCall('getDrums', []).then(function(drums){
    STATE.drums = drums.filter(function(d){ return d.Qolgan_metr > 0; });
    STATE.usageRows = [{ barabanId:'', metr:'' }];
    renderUsageRows();
  }).catch(function(err){ toast(err.message, 'error'); });
}
function drumOptionsHtml(selected){
  return '<option value="">-- ' + t('selectDrum') + ' --</option>' + STATE.drums.map(function(d){
    return '<option value="' + d.Baraban_ID + '" ' + (d.Baraban_ID===selected?'selected':'') + '>' + d.Baraban_ID + ' — ' + escapeHtml(d.Kabel_nomi) + ' (' + d.Qolgan_metr + ' m)</option>';
  }).join('');
}
function renderUsageRows(){
  const wrap = document.getElementById('us-rows');
  wrap.innerHTML = STATE.usageRows.map(function(row, i){
    return '<div class="usage-row">' +
      '<div class="field" style="margin:0;"><select onchange="STATE.usageRows[' + i + '].barabanId=this.value;calcUsageTotal();">' + drumOptionsHtml(row.barabanId) + '</select></div>' +
      '<div class="field" style="margin:0;"><input type="number" min="1" placeholder="' + t('meters') + '" value="' + row.metr + '" oninput="STATE.usageRows[' + i + '].metr=this.value;calcUsageTotal();"></div>' +
      '<button class="btn btn-ghost btn-sm" onclick="removeUsageRow(' + i + ')">✕</button>' +
    '</div>';
  }).join('');
  calcUsageTotal();
}
function addUsageRow(){ STATE.usageRows.push({barabanId:'',metr:''}); renderUsageRows(); }
function removeUsageRow(i){ if (STATE.usageRows.length>1){ STATE.usageRows.splice(i,1); renderUsageRows(); } }
function calcUsageTotal(){
  const total = STATE.usageRows.reduce(function(s,r){ return s + (Number(r.metr)||0); }, 0);
  document.getElementById('us-total').textContent = t('totalToUse') + ': ' + total + ' m';
}
let usageSubmitLock = false;
function submitUsage(){
  if (usageSubmitLock) return;
  document.getElementById('us-error').style.display = 'none';
  const items = STATE.usageRows.filter(function(r){ return r.barabanId && Number(r.metr) > 0; })
    .map(function(r){ return { barabanId:r.barabanId, metr:Number(r.metr) }; });
  const payload = {
    sana: document.getElementById('us-date').value,
    loyihaNomi: document.getElementById('us-project').value.trim(),
    masulXodimlar: document.getElementById('us-employees').value.trim(),
    manzil: document.getElementById('us-address').value.trim(),
    latitude: document.getElementById('us-lat').value.trim(),
    longitude: document.getElementById('us-lng').value.trim(),
    izoh: document.getElementById('us-note').value.trim(),
    items: items,
    clientRequestId: 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2)
  };
  usageSubmitLock = true;
  document.getElementById('us-submit-btn').disabled = true;
  authCall('saveUsage', [payload]).then(function(res){
    toast('✅ ' + res.totalMeters + ' m ' + (STATE.lang==='ru'?'сохранено':'saqlandi'), 'success');
    renderUsagePage();
  }).catch(function(err){ showErr('us-error', err); }).finally(function(){
    usageSubmitLock = false;
    const btn = document.getElementById('us-submit-btn'); if (btn) btn.disabled = false;
  });
}

function applyReportFilters(){
  STATE.reportFilters = {
    dateFrom: document.getElementById('rf-from').value || null,
    dateTo: document.getElementById('rf-to').value || null,
    project: document.getElementById('rf-project').value.trim() || null,
    employee: document.getElementById('rf-employee').value.trim() || null,
    cableTypeId: document.getElementById('rf-type').value || null
  };
  loadReportData(STATE.reportFilters);

function resetReportFilters(){
  document.getElementById('rf-from').value = '';
  document.getElementById('rf-to').value = '';
  document.getElementById('rf-project').value = '';
  document.getElementById('rf-employee').value = '';
  document.getElementById('rf-type').value = '';
  STATE.reportFilters = {};
  loadReportData({});
}
function loadReportData(filters){
  authCall('getReportAggregates', [filters]).then(function(data){
    document.getElementById('rp-stats').innerHTML =
      statCard('➕', t('totalToUse'), data.totalMeters + ' m', '#eff6ff', 'var(--blue)') +
      statCard('💧', t('totalRemaining'), data.totalRemainingAll + ' m', '#f0fdf4', 'var(--green)') +
      statCard('📋', t('recordUsage'), data.rows.length, '#fef9c3', '#a16207');

    document.getElementById('rp-table').innerHTML = data.rows.length ?
      ('<table><thead><tr><th>' + t('workDate') + '</th><th>ID</th><th>' + t('project') + '</th><th>' + t('employees') + '</th><th>' + t('drumId') + '</th><th>' + t('cableType') + '</th><th>' + t('meters') + '</th><th>' + t('telegramStatus') + '</th></tr></thead><tbody>' +
      data.rows.map(function(r){
        const okStatus = r.Telegram_holati === 'Yuborildi';
        return '<tr><td>' + fmtDate(r.Sana) + '</td><td>' + r.Ish_ID + '</td><td>' + escapeHtml(r.Loyiha_nomi) + '</td><td>' + escapeHtml(r.Masul_xodimlar) + '</td>' +
          '<td>' + r.Baraban_ID + '</td><td>' + escapeHtml(r.Kabel_nomi) + '</td><td>' + r.Sarflangan_metr + ' m</td>' +
          '<td><span class="badge ' + (okStatus?'badge-good':'badge-critical') + '">' + escapeHtml(String(r.Telegram_holati||'-')) + '</span>' +
          (!okStatus ? ' <button class="btn btn-ghost btn-sm" onclick="retryTelegram(\''+r.Sarf_ID+'\')">🔄</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>') : '<div class="empty-state">' + t('noData') + '</div>';
  }).catch(function(err){ toast(err.message, 'error'); });
}
function retryTelegram(sarfId){
  authCall('retryUsageTelegram', [sarfId]).then(function(){ toast('OK','success'); loadReportData(STATE.reportFilters); }).catch(function(err){ toast(err.message,'error'); });
}
function exportReport(){
  const btn = document.getElementById('rf-export'); btn.disabled = true; btn.textContent = '⏳ ...';
  authCall('exportReportXlsx', [STATE.reportFilters]).then(function(res){
    const byteChars = atob(res.base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i=0;i<byteChars.length;i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const blob = new Blob([new Uint8Array(byteNumbers)], { type: res.mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = res.filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }).catch(function(err){ toast(err.message, 'error'); }).finally(function(){
    btn.disabled = false; btn.textContent = '⬇️ ' + t('exportExcel');
  });
}
