<!DOCTYPE html>
<html lang="uz">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabel Ombor Tizimi</title>
<style>
:root{
  --navy:#101c35; --navy-2:#152743; --navy-3:#1b3560;
  --blue:#3b6cf0; --blue-dark:#2d57d6; --blue-light:#eaf1ff;
  --bg:#eef2f9; --card:#ffffff; --border:#e7ecf5; --text:#1c2537; --muted:#7c879b;
  --green:#22c55e; --yellow:#eab308; --orange:#f97316; --red:#ef4444;
  --radius:16px; --shadow:0 6px 22px rgba(20,35,75,.06), 0 1px 3px rgba(20,35,75,.05);
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#c7cede;border-radius:8px;}

/* ---------- LOADING ---------- */
#loading-screen{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;flex-direction:column;gap:14px;z-index:999;}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- AUTH SCREENS ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#1b3560,#0d1730 65%);padding:20px;}
.auth-card{background:#fff;border-radius:20px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 24px 70px rgba(0,0,0,.4);}
.auth-logo{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--navy-3));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;}
.auth-title{text-align:center;font-size:20px;font-weight:800;margin:0 0 4px;}
.auth-sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 24px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:11px;font-size:14px;outline:none;transition:.15s;background:#fbfcfe;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);background:#fff;}
.btn{border:none;border-radius:11px;padding:11px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:.15s;}
.btn-primary{background:linear-gradient(100deg,var(--blue),var(--blue-dark));color:#fff;width:100%;box-shadow:0 6px 16px rgba(59,108,240,.28);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 9px 20px rgba(59,108,240,.34);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.btn-outline{background:#fff;color:var(--blue);border:1.5px solid #cfdcf7;}
.btn-outline:hover{background:var(--blue-light);}
.btn-danger{background:#fff;color:var(--red);border:1.5px solid #fbd5d5;}
.btn-ghost{background:transparent;color:var(--muted);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}
.auth-error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px;display:none;}

/* ---------- APP SHELL ---------- */
#app-shell{display:none;min-height:100vh;}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:250px;background:linear-gradient(175deg,#101c35 0%,#132444 55%,#193256 100%);color:#c7d0e8;padding:22px 15px;display:flex;flex-direction:column;z-index:50;transition:.2s;}
.sidebar-logo{display:flex;align-items:center;gap:11px;padding:4px 6px 22px;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,.1);}
.sidebar-logo-icon{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#3b6cf0,#274ec2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 4px 12px rgba(50,90,220,.4);}
.sidebar-logo-text{line-height:1.25;}
.sidebar-logo-text b{color:#fff;font-size:14.5px;display:block;font-weight:800;}
.sidebar-logo-text span{color:#8b98b8;font-size:11px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10.5px 12px;border-radius:11px;color:#b7c2dd;text-decoration:none;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:3px;transition:.15s;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:linear-gradient(100deg,#3b6cf0,#2d57d6);color:#fff;box-shadow:0 6px 16px rgba(45,87,214,.35);}
.nav-icon{width:19px;text-align:center;font-size:14.5px;}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}
.lang-row{display:flex;background:rgba(255,255,255,.06);border-radius:11px;padding:3px;margin-bottom:10px;}
.lang-btn{flex:1;border:none;background:transparent;padding:7px 10px;border-radius:8px;font-size:11.5px;font-weight:700;color:#8b98b8;}
.lang-btn.active{background:rgba(255,255,255,.14);color:#fff;}
.profile-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:11px;cursor:pointer;position:relative;}
.profile-row:hover{background:rgba(255,255,255,.06);}
.profile-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3b6cf0,#274ec2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;}
.profile-text b{display:block;font-size:12.5px;color:#fff;font-weight:700;}
.profile-text span{font-size:10.5px;color:#8b98b8;}
.profile-menu{position:absolute;bottom:52px;left:0;right:0;background:#fff;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);overflow:hidden;display:none;}
.profile-menu.open{display:block;}
.profile-menu button{width:100%;text-align:left;padding:11px 14px;border:none;background:none;font-size:12.5px;color:var(--text);font-weight:600;}
.profile-menu button:hover{background:var(--bg);}

.main{margin-left:250px;min-height:100vh;display:flex;flex-direction:column;}
.topbar{padding:26px 32px 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.topbar-title{font-size:22px;font-weight:800;color:#141d33;letter-spacing:-.03em;}
.topbar-sub{color:var(--muted);font-size:13px;margin-top:4px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.topbar-right-inner{display:flex;align-items:center;gap:12px;}
.bell-btn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--shadow);}
.bell-dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff;display:none;}
.bell-dot.show{display:block;}
.mobile-menu-btn{display:none;border:none;background:#fff;border:1px solid var(--border);width:38px;height:38px;border-radius:10px;font-size:16px;box-shadow:var(--shadow);}
.user-chip{display:flex;align-items:center;gap:9px;background:#fff;padding:6px 14px 6px 6px;border-radius:24px;font-size:13px;font-weight:700;position:relative;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow);}
.user-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--navy-3));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.user-menu{position:absolute;top:48px;right:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);min-width:180px;display:none;overflow:hidden;z-index:60;}
.user-menu.open{display:block;}
.user-menu button{width:100%;text-align:left;padding:10px 14px;border:none;background:none;font-size:13px;color:var(--text);font-weight:600;}
.user-menu button:hover{background:var(--bg);}
.topbar-datetime{font-size:11.5px;color:var(--muted);text-align:right;margin-top:6px;}

#page-content{padding:16px 32px 56px;flex:1;max-width:1560px;width:100%;}
.page{display:none;}
.page.active{display:block;}

/* ---------- CARDS / GRID ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px;}
.stat-card{background:var(--card);border-radius:var(--radius);padding:19px 20px;box-shadow:var(--shadow);border:1px solid var(--border);}
.stat-card .label{font-size:12.5px;color:var(--muted);font-weight:700;}
.stat-card .value{font-size:25px;font-weight:800;margin-top:6px;letter-spacing:-.03em;}
.stat-card .delta{font-size:11.5px;color:var(--muted);margin-top:5px;}
.stat-card .delta.up{color:#16a34a;font-weight:700;}
.stat-card .icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:11px;}
.section-card{background:var(--card);border-radius:var(--radius);padding:19px 21px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:18px;}
.section-title{font-size:14.5px;font-weight:800;margin:0 0 15px;display:flex;align-items:center;justify-content:space-between;color:#182238;}
.section-title .link{font-size:12px;color:var(--blue);font-weight:700;cursor:pointer;}
.dash-top-grid{display:grid;grid-template-columns:2fr 1.05fr;gap:18px;margin-bottom:18px;align-items:start;}
.dash-chart-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;}
@media(max-width:1150px){.dash-top-grid,.dash-chart-grid{grid-template-columns:1fr;} .stat-grid{grid-template-columns:repeat(2,1fr);}}

.drum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.drum-card{background:var(--card);border-radius:14px;padding:15px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:.15s;position:relative;}
.drum-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,35,75,.11);}
.drum-status-dot{position:absolute;top:13px;right:13px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.03);}
.drum-id{font-weight:800;font-size:13px;}
.drum-type{font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:600;}
.ring-wrap{position:relative;width:104px;height:104px;border-radius:50%;margin:2px 0 9px;}
.ring-center{position:absolute;inset:9px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 6px rgba(20,35,75,.13);}
.ring-percent-wrap{position:absolute;bottom:-3px;background:#fff;border-radius:20px;padding:2px 9px;box-shadow:0 3px 8px rgba(20,35,75,.16);border:1px solid var(--border);}
.ring-percent{font-size:12.5px;font-weight:800;}
.drum-meters-row{font-size:11px;color:var(--muted);margin-top:1px;line-height:1.65;}
.drum-meters-row b{color:var(--text);font-weight:700;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;margin-top:8px;}
.badge-good{background:#dcfce7;color:#15803d;}
.badge-medium{background:#fef9c3;color:#854d0e;}
.badge-low{background:#ffedd5;color:#c2410c;}
.badge-critical{background:#fee2e2;color:#b91c1c;}
.dot-good{background:var(--green);} .dot-medium{background:var(--yellow);} .dot-low{background:var(--orange);} .dot-critical{background:var(--red);}

.reel-svg{width:42px;height:42px;position:relative;z-index:1;}

.list-rows{display:flex;flex-direction:column;gap:2px;}
.list-row{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid #f0f2f7;cursor:default;}
.list-row:last-child{border-bottom:none;}
.list-row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.list-row .rtext{flex:1;min-width:0;}
.list-row .rtext b{display:block;font-size:12.8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-row .rtext span{font-size:11px;color:var(--muted);}
.list-row .rval{font-size:12px;font-weight:800;color:var(--text);white-space:nowrap;}
.list-row .chev{color:#c3ccdd;font-size:15px;}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 10px;background:#f7f9fc;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;}
td{padding:10px;border-bottom:1px solid var(--border);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#f9fafd;}
.empty-state{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;justify-content:space-between;}
.toolbar-left{display:flex;gap:10px;flex-wrap:wrap;}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}

.usage-row{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;}
.usage-total{background:var(--blue-light);border:1px solid #cfe0fb;border-radius:11px;padding:12px 14px;font-size:14px;font-weight:800;color:var(--blue-dark);margin-top:8px;}

.range-toggle{display:flex;background:var(--bg);border-radius:9px;padding:3px;gap:2px;}
.range-btn{border:none;background:transparent;padding:6px 11px;border-radius:7px;font-size:11.5px;font-weight:700;color:var(--muted);}
.range-btn.active{background:#fff;color:var(--blue);box-shadow:0 2px 6px rgba(20,35,75,.1);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal-box{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:24px;box-shadow:0 24px 70px rgba(8,20,43,.3);}
.modal-box.wide{max-width:720px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{margin:0;font-size:16.5px;font-weight:800;}
.close-x{border:none;background:var(--bg);width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--muted);}

/* Toast */
#toast-root{position:fixed;bottom:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 16px;border-radius:11px;color:#fff;font-size:13.5px;font-weight:700;box-shadow:var(--shadow);min-width:220px;animation:slideIn .2s ease;}
.toast-success{background:#16a34a;} .toast-error{background:#dc2626;} .toast-info{background:var(--navy-3);}
@keyframes slideIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

.history-item{border-left:3px solid var(--blue);padding:8px 0 8px 12px;margin-bottom:8px;font-size:12.5px;}
.history-item .h-top{font-weight:700;}
.history-item .h-meta{color:var(--muted);font-size:11.5px;margin-top:2px;}

.donut-legend{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.donut-legend-row{display:flex;align-items:center;gap:9px;font-size:12.5px;}
.donut-legend-row .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.donut-legend-row b{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.donut-legend-row .pct{color:var(--muted);font-weight:700;width:38px;text-align:right;}
.donut-legend-row .mtr{color:var(--muted);width:64px;text-align:right;}

@media(max-width:800px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .usage-row{grid-template-columns:1fr;}
  .topbar{padding:18px 16px 4px;}
  #page-content{padding:12px 16px 40px;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .mobile-menu-btn{display:block;}
}
</style>
</head>
<body>

<div id="loading-screen"><div class="spinner"></div><div id="loading-text">Yuklanmoqda...</div></div>

<!-- FIRST-RUN ADMIN SETUP -->
<div id="setup-screen" class="auth-wrap" style="display:none;">
  <div class="auth-card">
    <div class="auth-logo">🔧</div>
    <p class="auth-title">Birinchi admin yaratish</p>
    <p class="auth-sub">Tizimda hali foydalanuvchi yo'q. Boshqaruvchi (Admin) hisobini yarating.</p>
    <div class="auth-error" id="setup-error"></div>
    <div class="field"><label>Login</label><input id="setup-login" placeholder="masalan: admin"></div>
    <div class="field"><label>Parol (kamida 8 belgi)</label><input id="setup-password" type="password"></div>
    <div class="field"><label>Parolni tasdiqlang</label><input id="setup-password2" type="password"></div>
    <button class="btn btn-primary" id="setup-submit-btn" onclick="doFirstAdminSetup()">Admin yaratish</button>
  </div>
</div>

<!-- LOGIN -->
<div id="login-screen" class="auth-wrap" style="display:none;">
  <div class="auth-card">
    <div class="auth-logo">🔌</div>
    <p class="auth-title">Kabel Ombor Tizimi</p>
    <p class="auth-sub">Tizimga kirish uchun login va parolingizni kiriting</p>
    <div class="auth-error" id="login-error"></div>
    <div class="field"><label>Login</label><input id="login-login" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="field"><label>Parol</label><input id="login-password" type="password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-primary" id="login-submit-btn" onclick="doLogin()">Kirish</button>
  </div>
</div>

<!-- APP SHELL -->
<div id="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">🧵</div>
      <div class="sidebar-logo-text"><b>Ombor</b><span>Kabel hisobi</span></div>
    </div>
    <div id="nav-list"></div>
    <div class="sidebar-footer">
      <div class="lang-row">
        <button class="lang-btn" id="lang-uz" onclick="setLang('uz')">O'zbek</button>
        <button class="lang-btn" id="lang-ru" onclick="setLang('ru')">Русский</button>
      </div>
      <div class="profile-row" onclick="document.getElementById('sidebar-profile-menu').classList.toggle('open')">
        <div class="profile-avatar" id="sb-avatar">?</div>
        <div class="profile-text"><b id="sb-name">—</b><span id="sb-role">—</span></div>
        <div class="profile-menu" id="sidebar-profile-menu">
          <button onclick="openChangePasswordModal()">🔑 <span data-t="changePassword">Parolni o'zgartirish</span></button>
          <button onclick="doLogout()">🚪 <span data-t="logout">Chiqish</span></button>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:flex-start;gap:10px;">
        <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div>
          <div class="topbar-title" id="page-title-text">—</div>
          <div class="topbar-sub" id="page-subtitle-text"></div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-right-inner">
          <button class="bell-btn" onclick="navigate('drums')">🔔<span class="bell-dot" id="bell-dot"></span></button>
          <div class="user-chip" onclick="document.getElementById('user-menu').classList.toggle('open')">
            <div class="user-avatar" id="user-avatar">?</div>
            <span id="user-chip-name">—</span>
            <div class="user-menu" id="user-menu">
              <button onclick="openChangePasswordModal()">🔑 <span data-t="changePassword">Parolni o'zgartirish</span></button>
              <button onclick="doLogout()">🚪 <span data-t="logout">Chiqish</span></button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div style="text-align:right;padding:0 32px;">
      <div class="topbar-datetime" id="topbar-datetime">—</div>
    </div>

    <main id="page-content">
      <section class="page" id="page-dashboard"></section>
      <section class="page" id="page-drums"></section>
      <section class="page" id="page-cabletypes"></section>
      <section class="page" id="page-usage"></section>
      <section class="page" id="page-reports"></section>
      <section class="page" id="page-users"></section>
      <section class="page" id="page-settings"></section>
    </main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ============================================================
   HOLAT (STATE) VA TARJIMALAR
   ============================================================ */
var STATE = {
  token: localStorage.getItem('kabelombor_token') || null,
  user: null,
  lang: localStorage.getItem('kabelombor_lang') || 'uz',
  page: 'dashboard',
  drums: [],
  cableTypes: [],
  usageRows: [{ barabanId: '', metr: '' }],
  reportFilters: {},
  chartRangeDays: 30,
  lowStockCount: 0
};

var ROLES = { ADMIN: 'Admin', WAREHOUSE: 'Omborchi', VIEWER: 'Kuzatuvchi' };

var ROLE_LABELS = {
  uz: { Admin: 'Administrator', Omborchi: 'Omborchi', Kuzatuvchi: 'Kuzatuvchi' },
  ru: { Admin: 'Администратор', Omborchi: 'Складовщик', Kuzatuvchi: 'Наблюдатель' }
};

   SERVER API (fetch orqali Apps Script Web App'ga so'rov)
   ============================================================ */
var API_URL = 'https://script.google.com/macros/s/AKfycbx8_JvMuVR2PwGjaAbWZJzFarK_kxpZQQ28bGLwzR-Kr8OyztTb9mE0-pWvJEBEMCE8/exec';

function call(fnName, args){
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fnName, args: args || [] })
  })
  .then(function(res){
    if (!res.ok) throw new Error('Server xatosi: HTTP ' + res.status);
    return res.json();
  })
  .then(function(data){
    if (!data.success) throw new Error(data.error || 'Nomalum xatolik');
    return data.result;
  });
}
function authCall(fnName, args){
  args = args || [];
  return call(fnName, [STATE.token].concat(args)).catch(function(err){
    var msg = (err && err.message) || String(err);
    if (msg.indexOf('SESSIYA_TUGAGAN') !== -1) {
      toast(STATE.lang === 'ru' ? 'Сессия истекла, войдите снова' : 'Sessiya tugagan, qaytadan kiring', 'error');
      hardLogout();
      throw err;
    }
    throw err;
  });
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg, type){
  var root = document.getElementById('toast-root');
  var el = document.createElement('div');
  el.className = 'toast toast-' + (type || 'info');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function(){ el.remove(); }, 4200);
}
function showErr(elId, err){
  var box = document.getElementById(elId);
  box.textContent = (err && err.message) ? err.message : String(err);
  box.style.display = 'block';
}

/* ============================================================
   BOSHLANG'ICH YUKLASH
   ============================================================ */
window.addEventListener('DOMContentLoaded', boot);

function boot(){
  if (STATE.token) {
    call('checkSession', [STATE.token]).then(function(res){
      if (res.valid) {
        STATE.user = res.user;
        enterApp();
      } else {
        localStorage.removeItem('kabelombor_token');
        checkFirstRun();
      }
    }).catch(checkFirstRun);
  } else {
    checkFirstRun();
  }
}

function checkFirstRun(){
  call('isFirstRunSetup', []).then(function(isFirst){
    document.getElementById('loading-screen').style.display = 'none';
    if (isFirst) {
      document.getElementById('setup-screen').style.display = 'flex';
    } else {
      document.getElementById('login-screen').style.display = 'flex';
    }
  }).catch(function(err){
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    showErr('login-error', err);
  });
}

function doFirstAdminSetup(){
  var login = document.getElementById('setup-login').value.trim();
  var p1 = document.getElementById('setup-password').value;
  var p2 = document.getElementById('setup-password2').value;
  document.getElementById('setup-error').style.display = 'none';
  if (p1 !== p2) { showErr('setup-error', {message:'Parollar mos emas.'}); return; }
  var btn = document.getElementById('setup-submit-btn'); btn.disabled = true;
  call('createFirstAdmin', [login, p1]).then(function(){
    toast('Admin yaratildi. Endi kiring.', 'success');
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-login').value = login;
  }).catch(function(err){ showErr('setup-error', err); }).finally(function(){ btn.disabled = false; });
}

function doLogin(){
  var login = document.getElementById('login-login').value.trim();
  var pass = document.getElementById('login-password').value;
  document.getElementById('login-error').style.display = 'none';
  var btn = document.getElementById('login-submit-btn'); btn.disabled = true;
  call('login', [login, pass]).then(function(res){
    STATE.token = res.token;
    STATE.user = res.user;
    localStorage.setItem('kabelombor_token', res.token);
    document.getElementById('login-screen').style.display = 'none';
    enterApp();
  }).catch(function(err){ showErr('login-error', err); }).finally(function(){ btn.disabled = false; });
}

function hardLogout(){
  localStorage.removeItem('kabelombor_token');
  STATE.token = null; STATE.user = null;
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}
function doLogout(){
  authCall('logout', []).finally(hardLogout);
}

function enterApp(){
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'block';

  var initials = STATE.user.login.slice(0,2).toUpperCase();
  document.getElementById('user-chip-name').textContent = STATE.user.login;
  document.getElementById('user-avatar').textContent = initials;
  document.getElementById('sb-avatar').textContent = initials;
  document.getElementById('sb-name').textContent = STATE.user.login;
  var roleLabels = ROLE_LABELS[STATE.lang] || ROLE_LABELS.uz;
  document.getElementById('sb-role').textContent = roleLabels[STATE.user.role] || STATE.user.role;

  buildNav();
  setLang(STATE.lang, true);
  navigate('dashboard');
  startClock();
}

function startClock(){
  function tick(){
    var d = new Date();
    var pad = function(n){ return n < 10 ? '0' + n : n; };
    var dateStr = pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear();
    var timeStr = pad(d.getHours()) + ':' + pad(d.getMinutes());
    var el = document.getElementById('topbar-datetime');
    if (el) el.textContent = dateStr + '  ' + timeStr;
  }
  tick();
  setInterval(tick, 30000);
}

function buildNav(){
  var items = [
    {key:'dashboard', icon:'\ud83c\udfe0', label:'home', roles:[ROLES.ADMIN,ROLES.WAREHOUSE,ROLES.VIEWER]},
    {key:'drums', icon:'\ud83e\uddf5', label:'drums', roles:[ROLES.ADMIN,ROLES.WAREHOUSE,ROLES.VIEWER]},
    {key:'cabletypes', icon:'\ud83d\udd0c', label:'cableTypes', roles:[ROLES.ADMIN,ROLES.WAREHOUSE,ROLES.VIEWER]},
    {key:'usage', icon:'\ud83d\udcdd', label:'usageEntry', roles:[ROLES.ADMIN,ROLES.WAREHOUSE]},
    {key:'reports', icon:'\ud83d\udcca', label:'reports', roles:[ROLES.ADMIN,ROLES.WAREHOUSE,ROLES.VIEWER]},
    {key:'users', icon:'\ud83d\udc65', label:'users', roles:[ROLES.ADMIN]},
    {key:'settings', icon:'\u2699\ufe0f', label:'settings', roles:[ROLES.ADMIN]}
  ];
  var nav = document.getElementById('nav-list');
  nav.innerHTML = '';
  items.forEach(function(it){
    if (it.roles.indexOf(STATE.user.role) === -1) return;
    var a = document.createElement('div');
    a.className = 'nav-item' + (STATE.page === it.key ? ' active' : '');
    a.id = 'nav-' + it.key;
    a.innerHTML = '<span class="nav-icon">' + it.icon + '</span><span data-t="' + it.label + '">' + t(it.label) + '</span>';
    a.onclick = function(){ navigate(it.key); document.getElementById('sidebar').classList.remove('open'); };
    nav.appendChild(a);
  });
}

function setLang(lang, silent){
  STATE.lang = lang;
  localStorage.setItem('kabelombor_lang', lang);
  document.getElementById('lang-uz').classList.toggle('active', lang === 'uz');
  document.getElementById('lang-ru').classList.toggle('active', lang === 'ru');
  document.querySelectorAll('[data-t]').forEach(function(el){
    el.textContent = t(el.getAttribute('data-t'));
  });
  if (STATE.user) {
    var roleLabels = ROLE_LABELS[STATE.lang] || ROLE_LABELS.uz;
    var roleEl = document.getElementById('sb-role');
    if (roleEl) roleEl.textContent = roleLabels[STATE.user.role] || STATE.user.role;
  }
  if (!silent) renderCurrentPage();
}

var PAGE_SUBTITLES = {
  dashboard:'subDashboard', drums:'subDrums', cabletypes:'subCableTypes', usage:'subUsage',
  reports:'subReports', users:'subUsers', settings:'subSettings'
};
var PAGE_TITLES = {
  dashboard:'dashTitle', drums:'drumsTitle', cabletypes:'cableTypesTitle', usage:'usageTitle',
  reports:'reportsTitle', users:'usersTitle', settings:'settingsTitle'
};

function navigate(page){
  STATE.page = page;
  document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });
  var navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('page-' + page).classList.add('active');

  document.getElementById('page-title-text').textContent = t(PAGE_TITLES[page]);
  document.getElementById('page-subtitle-text').textContent = t(PAGE_SUBTITLES[page]);

  renderCurrentPage();
}

function renderCurrentPage(){
  var fns = { dashboard:renderDashboard, drums:renderDrumsPage, cabletypes:renderCableTypesPage,
    usage:renderUsagePage, reports:renderReportsPage, users:renderUsersPage, settings:renderSettingsPage };
  if (fns[STATE.page]) fns[STATE.page]();
}

var WIRE_PALETTE = ['#3b82f6', '#64748b', '#111827', '#e5e7eb', '#ef4444', '#22c55e', '#a855f7', '#f59e0b'];
function wireColorForType(name){
  var s = String(name || '');
  var sum = 0;
  for (var i = 0; i < s.length; i++) sum += s.charCodeAt(i);
  return WIRE_PALETTE[sum % WIRE_PALETTE.length];
}
function levelColor(level){
  return { good:'var(--green)', medium:'var(--yellow)', low:'var(--orange)', critical:'var(--red)' }[level] || 'var(--green)';
}
function levelDotClass(level){
  return 'dot-' + (level || 'good');
}
function levelLabel(level){
  return { good:t('good'), medium:t('medium'), low:t('low'), critical:t('critical') }[level] || '';
}
function reelSvg(wireColor){
  wireColor = wireColor || '#3b82f6';
  return '<svg class="reel-svg" viewBox="0 0 100 100">' +
    '<defs>' +
      '<radialGradient id="flangeGrad" cx="35%" cy="30%" r="75%">' +
        '<stop offset="0%" stop-color="#f0d9b5"/><stop offset="60%" stop-color="#d9a066"/><stop offset="100%" stop-color="#b5794a"/>' +
      '</radialGradient>' +
      '<radialGradient id="wireGrad" cx="35%" cy="30%" r="75%">' +
        '<stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="100%" stop-color="' + wireColor + '" stop-opacity="0"/>' +
      '</radialGradient>' +
    '</defs>' +
    '<circle cx="50" cy="50" r="44" fill="url(#flangeGrad)" stroke="#a9713f" stroke-width="2"/>' +
    '<circle cx="50" cy="50" r="30" fill="' + wireColor + '"/>' +
    '<circle cx="50" cy="50" r="30" fill="url(#wireGrad)"/>' +
    '<g stroke="rgba(0,0,0,.14)" stroke-width="1.4" fill="none">' +
      '<circle cx="50" cy="50" r="24"/><circle cx="50" cy="50" r="18"/><circle cx="50" cy="50" r="12"/>' +
    '</g>' +
    '<circle cx="50" cy="50" r="7" fill="#22314e"/>' +
    '<circle cx="50" cy="18" r="3" fill="#a9713f"/><circle cx="50" cy="82" r="3" fill="#a9713f"/>' +
    '<circle cx="18" cy="50" r="3" fill="#a9713f"/><circle cx="82" cy="50" r="3" fill="#a9713f"/>' +
  '</svg>';
}
function drumCardHtml(d){
  var color = levelColor(d.level);
  var wire = wireColorForType(d.Kabel_nomi);
  var ringStyle = 'background:conic-gradient(' + color + ' ' + Math.max(d.percent,0) + '%, #e9edf5 0);';
  return '<div class="drum-card" onclick="openDrumDetail(\'' + d.Baraban_ID + '\')">' +
    '<span class="drum-status-dot ' + levelDotClass(d.level) + '"></span>' +
    '<div class="drum-id">' + d.Baraban_ID + '</div>' +
    '<div class="drum-type">' + escapeHtml(d.Kabel_nomi) + (d.Baraban_raqami ? ' \u00b7 #' + escapeHtml(d.Baraban_raqami) : '') + '</div>' +
    '<div class="ring-wrap" style="' + ringStyle + '">' +
      '<div class="ring-center">' + reelSvg(wire) + '</div>' +
      '<div class="ring-percent-wrap"><span class="ring-percent">' + d.percent + '%</span></div>' +
    '</div>' +
    '<div class="drum-meters-row">' + t('remainingMeters') + ': <b>' + d.Qolgan_metr + ' m</b></div>' +
    '<div class="drum-meters-row">' + t('initialMeters') + ': <b>' + d.Boshlangich_metr + ' m</b></div>' +
  '</div>';
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtDate(v){
  if (!v) return '-';
  try { var d = new Date(v); if (isNaN(d)) return String(v); return d.toLocaleDateString(STATE.lang === 'ru' ? 'ru-RU' : 'uz-UZ'); }
  catch(e){ return String(v); }
}
function fmtDateTime(v){
  if (!v) return '-';
  try { var d = new Date(v); if (isNaN(d)) return String(v); return d.toLocaleString(STATE.lang === 'ru' ? 'ru-RU' : 'uz-UZ'); }
  catch(e){ return String(v); }
}

function statCard(icon, label, value, bg, color, deltaText){
  return '<div class="stat-card"><div class="icon" style="background:' + bg + ';color:' + color + ';">' + icon + '</div>' +

}

/* ---- Combo chart: kunlik ustunlar + kumulyativ chiziq ---- */
function drawComboChart(canvasId, labels, values, cumulative){
  var c = document.getElementById(canvasId); if (!c) return;
  var ctx = c.getContext('2d');
  var w = c.width = c.clientWidth; var h = c.height = 190;
  ctx.clearRect(0,0,w,h);
  var maxBar = Math.max.apply(null, values.concat([1])) * 1.2;
  var maxLine = Math.max.apply(null, cumulative.concat([1])) * 1.05;
  var padL = 34, padB = 22, padT = 14, padR = 10;
  var plotW = w - padL - padR, plotH = h - padT - padB;

  ctx.strokeStyle = '#eef1f7'; ctx.lineWidth = 1;
  for (var i=0;i<=3;i++){ var yy = padT + plotH - (plotH*i/3); ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(w-padR,yy); ctx.stroke(); }

  var n = values.length;
  var slot = plotW / n;
  var barW = Math.max(3, slot * 0.5);

  ctx.fillStyle = '#3b6cf0';
  values.forEach(function(v, i){
    var barH = (v / maxBar) * plotH;
    var x = padL + slot*i + (slot - barW)/2;
    var y = padT + plotH - barH;
    ctx.fillRect(x, y, barW, Math.max(barH,1));
  });

  ctx.beginPath();
  cumulative.forEach(function(v, i){
    var x = padL + slot*i + slot/2;
    var y = padT + plotH - (v/maxLine*plotH);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 2.2; ctx.stroke();
  cumulative.forEach(function(v, i){
    var x = padL + slot*i + slot/2;
    var y = padT + plotH - (v/maxLine*plotH);
    ctx.beginPath(); ctx.arc(x,y,2.4,0,Math.PI*2); ctx.fillStyle = '#16a34a'; ctx.fill();
  });

  ctx.fillStyle = '#9aa4b8'; ctx.font = '10px sans-serif';
  var step = Math.ceil(n/6);
  labels.forEach(function(l,i){
    if (i % step !== 0) return;
    var x = padL + slot*i + slot/2;
    ctx.fillText(l.slice(5), x-12, h-6);
  });
}

/* ---- Donut chart + legend ---- */
function drawDonutChart(canvasId, legendId, labels, values){
  var c = document.getElementById(canvasId); if (!c) return;
  var ctx = c.getContext('2d');
  var w = c.width = c.clientWidth; var h = c.height = 190;
  ctx.clearRect(0,0,w,h);
  var total = values.reduce(function(s,v){ return s+v; }, 0);
  var cx = w/2, cy = h/2, rOuter = Math.min(w,h)/2 - 8, rInner = rOuter * 0.58;
  var colors = ['#3b6cf0','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16'];

  if (total <= 0) {
    ctx.fillStyle = '#9aa4b8'; ctx.font = '12px sans-serif'; ctx.textAlign='center';
    ctx.fillText(t('noData'), cx, cy);
    ctx.textAlign='left';
    document.getElementById(legendId).innerHTML = '';
    return;
  }

  var start = -Math.PI/2;
  labels.forEach(function(l, i){
    var frac = values[i] / total;
    var end = start + frac * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx, cy, rOuter, start, end);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    start = end;
  });
  ctx.beginPath(); ctx.arc(cx,cy,rInner,0,Math.PI*2); ctx.fillStyle = '#ffffff'; ctx.fill();

  ctx.fillStyle = '#1c2537'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(total + ' m', cx, cy + 5);
  ctx.font = '10px sans-serif'; ctx.fillStyle = '#9aa4b8';
  ctx.fillText(t('totalToUse'), cx, cy - 10);
  ctx.textAlign = 'left';

  var legend = document.getElementById(legendId);
  legend.innerHTML = labels.map(function(l, i){
    var pct = Math.round(values[i]/total*100);
    return '<div class="donut-legend-row"><span class="dot" style="background:' + colors[i%colors.length] + ';"></span>' +
      '<b>' + escapeHtml(l) + '</b><span class="pct">' + pct + '%</span><span class="mtr">' + values[i] + ' m</span></div>';
  }).join('');
}

  if (usageSubmitLock) return;
  document.getElementById('us-error').style.display = 'none';
  var items = STATE.usageRows.filter(function(r){ return r.barabanId && Number(r.metr) > 0; })
    .map(function(r){ return { barabanId:r.barabanId, metr:Number(r.metr) }; });
  var payload = {
    sana: document.getElementById('us-date').value,
    loyihaNomi: document.getElementById('us-project').value.trim(),
    masulXodimlar: document.getElementById('us-employees').value.trim(),
    manzil: document.getElementById('us-address').value.trim(),
    latitude: document.getElementById('us-lat').value.trim(),
    longitude: document.getElementById('us-lng').value.trim(),
    izoh: document.getElementById('us-note').value.trim(),
    items: items,
    clientRequestId: 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2)
  };
  usageSubmitLock = true;
  document.getElementById('us-submit-btn').disabled = true;
  authCall('saveUsage', [payload]).then(function(res){
    toast('\u2705 ' + res.totalMeters + ' m ' + (STATE.lang==='ru'?'сохранено':'saqlandi'), 'success');
    renderUsagePage();
  }).catch(function(err){ showErr('us-error', err); }).finally(function(){
    usageSubmitLock = false;
    var btn = document.getElementById('us-submit-btn'); if (btn) btn.disabled = false;
  });
}

/* ============================================================
   HISOBOTLAR SAHIFASI
   ============================================================ */
function renderReportsPage(){
  var el = document.getElementById('page-reports');
  el.innerHTML =
    '<div class="section-card">' +
      '<div class="filter-grid">' +
        '<div class="field" style="margin:0;"><label>' + t('from') + '</label><input id="rf-from" type="date"></div>' +
        '<div class="field" style="margin:0;"><label>' + t('to') + '</label><input id="rf-to" type="date"></div>' +
        '<div class="field" style="margin:0;"><label>' + t('project') + '</label><input id="rf-project"></div>' +
        '<div class="field" style="margin:0;"><label>' + t('employee') + '</label><input id="rf-employee"></div>' +
        '<div class="field" style="margin:0;"><label>' + t('cableType') + '</label><select id="rf-type"><option value="">' + t('all') + '</option></select></div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;"><button class="btn btn-primary btn-sm" style="width:auto;" onclick="applyReportFilters()">\ud83d\udd0d ' + t('filter') + '</button>' +
      '<button class="btn btn-ghost btn-sm" onclick="resetReportFilters()">' + t('reset') + '</button>' +
      '<button class="btn btn-outline btn-sm" onclick="exportReport()" id="rf-export">\u2b07\ufe0f ' + t('exportExcel') + '</button></div>' +
    '</div>' +
    '<div class="stat-grid" id="rp-stats"></div>' +
    '<div class="section-card"><div class="section-title">' + t('recentUsage') + '</div><div class="table-wrap" id="rp-table"></div></div>';

  authCall('getCableTypes', []).then(function(types){
    var sel = document.getElementById('rf-type');
    types.forEach(function(c){ sel.innerHTML += '<option value="' + c.Kabel_turi_ID + '">' + escapeHtml(c.Kabel_nomi) + '</option>'; });
  });
  loadReportData({});
}
function applyReportFilters(){
  STATE.reportFilters = {
    dateFrom: document.getElementById('rf-from').value || null,
    dateTo: document.getElementById('rf-to').value || null,
    project: document.getElementById('rf-project').value.trim() || null,
    employee: document.getElementById('rf-employee').value.trim() || null,
    cableTypeId: document.getElementById('rf-type').value || null
  };
  loadReportData(STATE.reportFilters);
}
function resetReportFilters(){
  document.getElementById('rf-from').value = '';
  document.getElementById('rf-to').value = '';
  document.getElementById('rf-project').value = '';
  document.getElementById('rf-employee').value = '';
  document.getElementById('rf-type').value = '';
  STATE.reportFilters = {};
  loadReportData({});
}
function loadReportData(filters){
  authCall('getReportAggregates', [filters]).then(function(data){
    document.getElementById('rp-stats').innerHTML =
      statCard('\u2795', t('totalToUse'), data.totalMeters + ' m', '#eaf1ff', 'var(--blue)', '') +
      statCard('\ud83d\udca7', t('totalRemaining'), data.totalRemainingAll + ' m', '#f0fdf4', 'var(--green)', '') +
      statCard('\ud83d\udccb', t('recordUsage'), data.rows.length, '#fef9c3', '#a16207', '');

    document.getElementById('rp-table').innerHTML = data.rows.length ?
      ('<table><thead><tr><th>' + t('workDate') + '</th><th>ID</th><th>' + t('project') + '</th><th>' + t('employees') + '</th><th>' + t('drumId') + '</th><th>' + t('cableType') + '</th><th>' + t('meters') + '</th><th>' + t('telegramStatus') + '</th></tr></thead><tbody>' +
      data.rows.map(function(r){
        var okStatus = r.Telegram_holati === 'Yuborildi';
        return '<tr><td>' + fmtDate(r.Sana) + '</td><td>' + r.Ish_ID + '</td><td>' + escapeHtml(r.Loyiha_nomi) + '</td><td>' + escapeHtml(r.Masul_xodimlar) + '</td>' +
          '<td>' + r.Baraban_ID + '</td><td>' + escapeHtml(r.Kabel_nomi) + '</td><td>' + r.Sarflangan_metr + ' m</td>' +
          '<td><span class="badge ' + (okStatus?'badge-good':'badge-critical') + '">' + escapeHtml(String(r.Telegram_holati||'-')) + '</span>' +
          (!okStatus ? ' <button class="btn btn-ghost btn-sm" onclick="retryTelegram(\''+r.Sarf_ID+'\')">\ud83d\udd04</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>') : '<div class="empty-state">' + t('noData') + '</div>';
  }).catch(function(err){ toast(err.message, 'error'); });
}
function retryTelegram(sarfId){
  authCall('retryUsageTelegram', [sarfId]).then(function(){ toast('OK','success'); loadReportData(STATE.reportFilters); }).catch(function(err){ toast(err.message,'error'); });
}
function exportReport(){
  var btn = document.getElementById('rf-export'); btn.disabled = true; btn.textContent = '\u23f3 ...';
  authCall('exportReportXlsx', [STATE.reportFilters]).then(function(res){
    var byteChars = atob(res.base64);
    var byteNumbers = new Array(byteChars.length);
    for (var i=0;i<byteChars.length;i++) byteNumbers[i] = byteChars.charCodeAt(i);
    var blob = new Blob([new Uint8Array(byteNumbers)], { type: res.mimeType });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = res.filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }).catch(function(err){ toast(err.message, 'error'); }).finally(function(){
    btn.disabled = false; btn.textContent = '\u2b07\ufe0f ' + t('exportExcel');
  });
}

/* ============================================================
   FOYDALANUVCHILAR SAHIFASI (Admin)
   ============================================================ */
function renderUsersPage(){
  var el = document.getElementById('page-users');
  el.innerHTML = '<div class="toolbar"><button class="btn btn-primary" style="width:auto;" onclick="openAddUserModal()">\u2795 ' + t('addUser') + '</button></div>' +
    '<div class="section-card"><div class="table-wrap" id="u-table"></div></div>';
  loadUsersTable();
}
function loadUsersTable(){
  authCall('getUsers', []).then(function(users){
    document.getElementById('u-table').innerHTML = '<table><thead><tr><th>' + t('login') + '</th><th>' + t('role') + '</th><th>' + t('status') + '</th><th>' + t('lastLogin') + '</th><th></th></tr></thead><tbody>' +
      users.map(function(u){
        var active = u.Faol===true||u.Faol==='TRUE'||u.Faol==='true';
        return '<tr><td>' + escapeHtml(u.Login) + '</td>' +
          '<td><select onchange="changeRole(\'' + u.User_ID + '\', this.value)">' +
            ['Admin','Omborchi','Kuzatuvchi'].map(function(r){ return '<option value="'+r+'" '+(r===u.Rol?'selected':'')+'>'+r+'</option>'; }).join('') + '</select></td>' +
          '<td><span class="badge ' + (active?'badge-good':'badge-critical') + '">' + (active?t('active'):t('inactive')) + '</span></td>' +
          '<td>' + fmtDateTime(u.Oxirgi_kirish) + '</td>' +
          '<td>' +
            '<button class="btn btn-ghost btn-sm" onclick="toggleUserActive(\''+u.User_ID+'\',' + (!active) + ')">' + (active?'\ud83d\udeab':'\u2705') + '</button>' +
            '<button class="btn btn-ghost btn-sm" onclick="openResetPasswordModal(\''+u.User_ID+'\')">\ud83d\udd11</button>' +
          '</td></tr>';
      }).join('') + '</tbody></table>';
  }).catch(function(err){ toast(err.message, 'error'); });
}
function openAddUserModal(){
  openModal(t('addUser'), '' +
    '<div class="field"><label>' + t('login') + '</label><input id="au-login"></div>' +
    '<div class="field"><label>' + t('password') + '</label><input id="au-pass" type="password"></div>' +
    '<div class="field"><label>' + t('role') + '</label><select id="au-role"><option value="Kuzatuvchi">Kuzatuvchi</option><option value="Omborchi">Omborchi</option><option value="Admin">Admin</option></select></div>' +
    '<div class="auth-error" id="au-error"></div>' +
    '<button class="btn btn-primary" onclick="submitAddUser()">' + t('save') + '</button>'
  );
}
function submitAddUser(){
  authCall('addUser', [document.getElementById('au-login').value.trim(), document.getElementById('au-pass').value, document.getElementById('au-role').value])
    .then(function(){ toast('OK','success'); closeModal(); loadUsersTable(); })
    .catch(function(err){ showErr('au-error', err); });
}
function changeRole(userId, role){
  authCall('setUserRole', [userId, role]).then(function(){ toast('OK','success'); }).catch(function(err){ toast(err.message,'error'); loadUsersTable(); });
}
function toggleUserActive(userId, active){
  authCall('setUserActive', [userId, active]).then(function(){ loadUsersTable(); }).catch(function(err){ toast(err.message,'error'); });
}
function openResetPasswordModal(userId){
  openModal(t('resetPassword'), '' +
    '<div class="field"><label>' + t('newPassword') + '</label><input id="rp-pass" type="password"></div>' +
    '<div class="auth-error" id="rp-error"></div>' +
    '<button class="btn btn-primary" onclick="submitResetPassword(\'' + userId + '\')">' + t('save') + '</button>'
  );
}
function submitResetPassword(userId){
  authCall('resetUserPassword', [userId, document.getElementById('rp-pass').value])
    .then(function(){ toast('OK','success'); closeModal(); })
    .catch(function(err){ showErr('rp-error', err); });
}
function openChangePasswordModal(){
  openModal(t('changePasswordTitle'), '' +
    '<div class="field"><label>' + t('oldPassword') + '</label><input id="cp-old" type="password"></div>' +
    '<div class="field"><label>' + t('newPassword') + '</label><input id="cp-new" type="password"></div>' +
    '<div class="auth-error" id="cp-error"></div>' +
    '<button class="btn btn-primary" onclick="submitChangePassword()">' + t('save') + '</button>'
  );
}
function submitChangePassword(){
  authCall('changeMyPassword', [document.getElementById('cp-old').value, document.getElementById('cp-new').value])
    .then(function(){ toast('OK','success'); closeModal(); })
    .catch(function(err){ showErr('cp-error', err); });
}

    '<div class="field"><label>' + t('telegramChatId') + '</label><input id="st-chatid"></div>' +
    '<button class="btn btn-primary btn-sm" style="width:auto;" onclick="submitChatId()">' + t('updateChatId') + '</button>' +
    '<button class="btn btn-outline btn-sm" onclick="testTelegram()">\ud83d\udce8 ' + t('telegramTest') + '</button>' +
    '<div class="auth-error" id="st-error"></div>' +
    '<div id="st-msg" style="margin-top:10px;font-size:13px;color:var(--muted);"></div>' +

function submitThreshold(){
  authCall('updateLowStockThreshold', [Number(document.getElementById('st-threshold').value)])
    .then(function(){ toast('OK','success'); }).catch(function(err){ showErr('st-error', err); });
}
function submitChatId(){
  authCall('updateTelegramChatId', [document.getElementById('st-chatid').value.trim()])
    .then(function(){ toast('OK','success'); }).catch(function(err){ showErr('st-error', err); });
}
function testTelegram(){
  authCall('testTelegramConnection', []).then(function(res){
    toast(res.ok ? '\u2705 OK' : ('\u274c ' + res.error), res.ok ? 'success' : 'error');
  }).catch(function(err){ toast(err.message, 'error'); });

/* ============================================================
   MODAL
   ============================================================ */
function openModal(title, bodyHtml, wide){
  document.getElementById('modal-root').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)closeModal();">' +
      '<div class="modal-box' + (wide?' wide':'') + '">' +
        '<div class="modal-head"><h3>' + title + '</h3><button class="close-x" onclick="closeModal()">\u2715</button></div>' +
        bodyHtml +
      '</div></div>';
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }
