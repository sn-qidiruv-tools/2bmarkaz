<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obyektlar">
<link rel="manifest" href="manifest.json">
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Xavfsiz shahar obyektlari</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
:root{
  --bg:#0a1020; --bg2:#0f1830; --surface:#131d37; --surface2:#1a2748; --line:#26365c;
  --text:#e9eefc; --muted:#8d9cc2; --accent:#3b82f6; --accent2:#22d3ee;
  --ok:#22c55e; --warn:#f59e0b; --red:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.ic{display:inline-grid;place-items:center;line-height:0}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Animatsiyalar ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-24px)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes starpop{0%{transform:scale(1)}40%{transform:scale(1.45) rotate(-12deg)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;background:var(--bg)}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:18px;animation:rise .5s both}
.splash-in .logo{width:72px;height:72px}
.loader{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
.splash-txt{color:var(--muted);font-size:14px;text-align:center;max-width:260px;line-height:1.5}

/* ---------- Kirish ---------- */
#loginView{position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;
  background:radial-gradient(120% 80% at 85% 0%,#1d3a8a 0%,transparent 60%),radial-gradient(100% 70% at 0% 100%,#0e7490 0%,transparent 55%),var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:float 14s ease-in-out infinite;pointer-events:none}
.orb.a{width:260px;height:260px;background:#3b82f6;top:-60px;left:-60px}
.orb.b{width:220px;height:220px;background:#22d3ee;bottom:-40px;right:-50px;animation-delay:-6s}
.lcard{position:relative;width:100%;max-width:380px;padding:30px 24px 26px;border-radius:24px;background:rgba(19,29,55,.72);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(120,150,230,.25);
  box-shadow:0 24px 60px rgba(0,0,0,.5);animation:rise .6s both}
.lcard.shake{animation:shake .45s}
.lcard .logo{width:64px;height:64px;margin:0 auto 14px;display:block;animation:pop .7s .15s both}
.lcard h1{font-size:22px;text-align:center;line-height:1.25}
.lcard p.sub{color:var(--muted);font-size:14px;text-align:center;margin:6px 0 22px}
.field{position:relative;margin-bottom:12px}
.field>.ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.field>.ic svg{width:20px;height:20px}
.field input{width:100%;height:52px;padding:0 48px 0 46px;font-size:16px;border-radius:14px;border:1px solid var(--line);background:rgba(10,16,32,.6);outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(59,130,246,.18)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;display:grid;place-items:center;color:var(--muted)}
.remember{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin:4px 2px 18px}
.remember input{width:18px;height:18px;accent-color:var(--accent)}
.lbtn{width:100%;height:52px;border-radius:14px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 10px 24px rgba(37,99,235,.4);transition:transform .15s,opacity .2s}
.lbtn:active{transform:scale(.98)}
.lbtn:disabled{opacity:.7}
#loginErr{min-height:20px;margin-top:14px;text-align:center;font-size:14px;color:var(--red)}
#loginErr.hint{color:var(--muted)}

/* ---------- Ilova ---------- */
#appView{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(180deg,#0f1b3b,var(--bg));border-bottom:1px solid var(--line);position:relative;z-index:1200}
.top .logo{width:36px;height:36px;flex-shrink:0}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:15px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:transform .15s}
.hbtn:active{transform:scale(.92)}
.hbtn.spin .ic{animation:spin .8s linear infinite}
.avatar{background:linear-gradient(135deg,#3b82f6,#22d3ee);border:0;font-weight:700;font-size:16px;color:#fff}
.menu{position:absolute;top:calc(100% - 4px);right:12px;width:250px;padding:14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.5);animation:pop .2s both;transform-origin:top right}
.menu b{display:block;font-size:16px}
.menu .role{font-size:13px;color:var(--accent2);margin:2px 0 8px}
.menu .meta{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.menu .mbtn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;background:var(--surface);font-size:14px;margin-top:8px}
.menu .mbtn.out{color:var(--red)}
.menu .mbtn .ic svg{width:18px;height:18px}

.toolbar{padding:10px 12px 8px;background:var(--bg);border-bottom:1px solid rgba(38,54,92,.6)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);transition:all .2s}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 6px 16px rgba(37,99,235,.35)}
.searchrow{display:flex;gap:8px}
.sel{position:relative;flex-shrink:0;width:132px}
.sel select{width:100%;height:44px;padding:0 28px 0 12px;font-size:13px;font-weight:600;border-radius:12px;border:1px solid var(--line);background:var(--surface);appearance:none;-webkit-appearance:none;outline:none}
.sel .ic{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.sel .ic svg{width:16px;height:16px}
.sbox{position:relative;flex:1;min-width:0}
.sbox>.ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sbox>.ic svg{width:18px;height:18px}
.sbox input{width:100%;height:44px;padding:0 40px 0 38px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none;transition:border-color .2s,box-shadow .2s}
.sbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.sbox input::-webkit-search-cancel-button{display:none}
.qx{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.qx svg{width:16px;height:16px}

#content{flex:1;min-height:0;position:relative}
.tab{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;visibility:hidden;opacity:0;transform:translateY(10px);transition:opacity .28s,transform .28s,visibility 0s .28s}
.tab.active{visibility:visible;opacity:1;transform:none;transition:opacity .28s,transform .28s}
.pad{padding:12px 12px 24px}
#tab-map{overflow:hidden;padding:0}
#map{width:100%;height:100%;background:#0f1830}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{padding:12px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:center;transition:all .2s}
.tile b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.tile span{display:block;font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
.tile.ok b{color:var(--ok)}
.tile.wait b{color:var(--warn)}
.tile.on{border-color:var(--accent);background:var(--surface2);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.resline{font-size:12px;color:var(--muted);margin:0 2px 10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;animation:rise .45s both;animation-delay:calc(var(--i,0)*40ms)}
.card.noloc{background:linear-gradient(180deg,rgba(248,113,113,.14),rgba(248,113,113,.06));border-color:rgba(248,113,113,.4)}
.card-top{display:flex;align-items:flex-start;gap:10px}
.card h3{flex:1;font-size:16px;line-height:1.3;word-break:break-word}
.star{flex-shrink:0;width:40px;height:40px;margin:-6px -6px 0 0;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:color .2s,background .2s}
.star svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.star.on{color:#fbbf24}
.star.on svg{fill:currentColor}
.star.pop svg{animation:starpop .45s}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.tag.ok{background:rgba(34,197,94,.15);color:#4ade80}
.tag.ok::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
.tag.wait{background:rgba(245,158,11,.15);color:#fbbf24}
.tag.wait::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}
.tag.red{background:rgba(248,113,113,.18);color:#fca5a5}
.tag.tum{background:rgba(59,130,246,.15);color:#93c5fd}
.main{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;margin-bottom:12px}
.main dt{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
.main dd{font-size:14px;word-break:break-all}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.2px}
.btns{display:flex;gap:8px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:12px;font-size:14px;font-weight:600;background:var(--surface2);border:1px solid var(--line);text-decoration:none;color:var(--text);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,#3b82f6,#2563eb);border-color:transparent;color:#fff}
.btn .ic svg{width:18px;height:18px}
.btn .chev{transition:transform .3s}
.card.open .chev,.pp.open .chev{transform:rotate(180deg)}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
.card.open>.more,.pp.open .more{grid-template-rows:1fr}
.more-in{overflow:hidden;min-height:0}
.more-pad{padding-top:12px}
.drow{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.drow span:first-child{color:var(--muted);flex-shrink:0;max-width:42%}
.drow span:last-child{text-align:right;word-break:break-word}
.more .btn{margin-top:10px;width:100%}

.skel{height:150px;border-radius:18px;margin-bottom:10px;background:linear-gradient(100deg,var(--surface) 30%,var(--surface2) 50%,var(--surface) 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 24px;color:var(--muted);animation:rise .4s both}
.empty svg{width:84px;height:84px;margin-bottom:14px;fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.empty b{color:var(--text);font-size:16px;margin-bottom:6px}
.empty p{font-size:14px;line-height:1.5;max-width:280px}
.empty .btn{margin-top:16px;flex:none;padding:0 22px}
.favhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.favhead h2{font-size:18px}
.favhead small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.favhead .acts{display:flex;gap:8px}
.favhead .btn{flex:none;padding:0 12px;height:38px;font-size:13px}

/* ---------- Pastki navigatsiya ---------- */
.bottom{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:1200}
.bottom button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:12px;font-weight:600;color:var(--muted);transition:color .25s}
.bottom button.on{color:#fff}
.bottom button.on .ic{transform:translateY(-2px) scale(1.1);color:var(--accent)}
.bottom .ic{transition:transform .3s cubic-bezier(.3,1.6,.5,1),color .25s}
.ind{position:absolute;top:-1px;left:0;width:33.3333%;height:3px;display:flex;justify-content:center;transform:translateX(calc(var(--t,0)*100%));transition:transform .4s cubic-bezier(.4,1.3,.5,1)}
.ind i{width:44px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#fbbf24;color:#1a1200;font-size:11px;font-weight:800;display:grid;place-items:center;animation:pop .3s both}

/* ---------- Xarita ---------- */
.mapbtns{position:absolute;right:12px;bottom:18px;z-index:800;display:flex;flex-direction:column;gap:10px}
.mbtn2{width:46px;height:46px;border-radius:14px;background:var(--surface);color:var(--text);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:transform .15s,background .2s,color .2s}
.mbtn2:active{transform:scale(.92)}
.mbtn2.on{background:#fbbf24;color:#1a1200;border-color:transparent}
.mapcount{position:absolute;left:12px;bottom:18px;z-index:800;display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.mapcount button{color:var(--accent2);font-weight:700;font-size:12px;padding:2px 0}
@keyframes hl{0%,55%{box-shadow:0 0 0 3px var(--accent2)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
.card{scroll-margin-top:10px}
.card.hl{animation:hl 1.8s ease}
.leaflet-container{font-family:inherit}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:0 6px 18px rgba(0,0,0,.4)!important;border-radius:12px!important;overflow:hidden}
.leaflet-bar a{background:var(--surface)!important;color:var(--text)!important;border-bottom-color:var(--line)!important}
.leaflet-top.leaflet-right{top:10px}
.pin{background:none;border:0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.pin svg{display:block}
.cl{background:none}
.cl div{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;
  background:radial-gradient(circle at 30% 25%,#60a5fa,#2563eb 70%);border:3px solid rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(37,99,235,.55)}
.leaflet-popup.pp .leaflet-popup-content-wrapper{background:var(--surface);color:var(--text);border-radius:16px;border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.leaflet-popup.pp .leaflet-popup-tip{background:var(--surface)}
.leaflet-popup.pp .leaflet-popup-content{margin:14px 14px 12px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted);top:6px;right:6px}
.pp h4{font-size:15px;line-height:1.3;padding-right:22px;margin-bottom:8px;word-break:break-word}
.pp .tags{margin:0 0 10px}
.pp .main{grid-template-columns:1fr;gap:6px;margin-bottom:10px}
.pp .btns .btn{height:38px;font-size:13px}
.pp .btns .star{width:38px;height:38px;margin:0;background:var(--surface2);border:1px solid var(--line);border-radius:12px;flex:none}
.pp a.btn{color:var(--text)}
.dot{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.3)}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:9500;max-width:86vw;padding:11px 18px;border-radius:999px;background:#e9eefc;color:#0a1020;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- Yuklanmoqda -->
<div id="splash">
  <div class="splash-in">
    <div class="logo" data-brand="s1"></div>
    <div class="loader"></div>
    <div class="splash-txt" id="splashTxt">Ma'lumot yuklanmoqda...</div>
  </div>
</div>

<!-- Kirish -->
<section id="loginView" hidden>
  <div class="orb a"></div><div class="orb b"></div>
  <form class="lcard" id="loginForm" autocomplete="on">
    <div class="logo" data-brand="s2"></div>
    <h1>Xavfsiz shahar obyektlari</h1>
    <p class="sub">Davom etish uchun tizimga kiring</p>
    <div class="field">
      <span class="ic" data-ic="user"></span>
      <input type="text" id="login" name="username" placeholder="Login" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    </div>
    <div class="field">
      <span class="ic" data-ic="lock"></span>
      <input type="password" id="password" name="password" placeholder="Parol" autocomplete="current-password" required>
      <button type="button" class="eye" id="eye" aria-label="Parolni ko'rsatish"><span class="ic" data-ic="eye"></span></button>
    </div>
    <label class="remember"><input type="checkbox" id="remember" checked> Meni eslab qol</label>
    <button class="lbtn" id="loginBtn" type="submit">Kirish</button>
    <div id="loginErr"></div>
  </form>
</section>

<!-- Ilova -->
<section id="appView" hidden>
  <header class="top">
    <div class="logo" data-brand="s3"></div>
    <div class="ttl"><h1>Xavfsiz shahar obyektlari</h1><small id="sub"></small></div>
    <button class="hbtn" id="btnRefresh" aria-label="Yangilash"><span class="ic" data-ic="refresh"></span></button>
    <button class="hbtn avatar" id="btnUser" aria-label="Profil"></button>
    <div class="menu" id="menu" hidden>
      <b id="mName"></b>
      <div class="role" id="mRole"></div>
      <div class="meta" id="mMeta"></div>
      <button class="mbtn" id="mRefresh"><span class="ic" data-ic="refresh"></span>Ma'lumotni yangilash</button>
      <button class="mbtn out" id="mLogout"><span class="ic" data-ic="logout"></span>Chiqish</button>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="chips" id="chips"></div>
    <div class="searchrow">
      <label class="sel"><select id="field"></select><span class="ic" data-ic="chevron"></span></label>
      <div class="sbox">
        <span class="ic" data-ic="search"></span>
        <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="qx" id="qx" hidden aria-label="Tozalash"><span class="ic" data-ic="x"></span></button>
      </div>
    </div>
  </div>

  <main id="content">
    <div class="tab active" id="tab-list">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function () {
"use strict";

/* ================= SOZLAMA ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbybkxT1P6qIxTcB9pIn247R7Jc7CEPSs8jchCSHawzcfwtgmEd_YK291RhwLXyvBb0-/exec";
const REFRESH_MS = 10 * 60 * 1000;   // avtomatik yangilanish
const MAP_START = [39.7747, 64.4286]; // Buxoro
const CHUNK = 30;                     // ro'yxatda bir yo'la chiqadigan kartalar soni
/* =========================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- O'zim chizgan belgilar ---------- */
const I = {
  list: '<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></svg>',
  map: '<svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v13L9 17l6 3 6-2.5v-13L15 7 9 4z"/><path d="M9 4v13M15 7v13"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6 6.8 19.4l1-5.9L3.5 9.4l5.9-.8L12 3.2z"/></svg>',
  refresh: '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>',
  logout: '<svg viewBox="0 0 24 24"><path d="M9 4H5v16h4"/><path d="M16 8l4 4-4 4M20 12H9"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  chevron: '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  nav: '<svg viewBox="0 0 24 24"><path d="M12 3l7 17-7-4-7 4 7-17z"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  locate: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>',
  layers: '<svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
  eye: '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff: '<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.5 7.6A17 17 0 0 0 2 12s3.6 6 10 6c1.5 0 2.8-.3 4-.8"/><path d="M9.9 10a3 3 0 0 0 4.1 4.1"/></svg>',
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-5 8-5s6.5 1 8 5"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
};
const ic = n => '<span class="ic">' + I[n] + '</span>';

function brand(id) {
  return '<svg viewBox="0 0 32 32" width="100%" height="100%"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>' +
    '<path d="M16 2.5l11 4v8.2c0 7-4.6 12.4-11 14.8C9.6 27.1 5 21.7 5 14.7V6.5l11-4z" fill="url(#' + id + ')"/>' +
    '<circle cx="16" cy="13" r="4.2" fill="none" stroke="#fff" stroke-width="2"/><circle cx="16" cy="13" r="1.4" fill="#fff"/>' +
    '<path d="M11 21.3c1.4 1 3 1.5 5 1.5s3.6-.5 5-1.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>';
}

function pinSvg(color, fav) {
  return '<svg viewBox="0 0 36 44" width="36" height="44"><path d="M18 42C18 42 4 27 4 16a14 14 0 1 1 28 0c0 11-14 26-14 26z" fill="' + color + '" stroke="#fff" stroke-width="2.5"/>' +
    '<circle cx="18" cy="16" r="5.6" fill="#fff"/>' +
    (fav ? '<path d="M18 11.2l1.5 3.1 3.4.5-2.5 2.4.6 3.4-3-1.6-3 1.6.6-3.4-2.5-2.4 3.4-.5z" fill="' + color + '"/>' : '<circle cx="18" cy="16" r="2.4" fill="' + color + '"/>') +
    '</svg>';
}

document.querySelectorAll("[data-ic]").forEach(el => { el.innerHTML = I[el.dataset.ic]; });
document.querySelectorAll("[data-brand]").forEach(el => { el.innerHTML = brand(el.dataset.brand); });

/* ---------- Holat ---------- */
const FIELDS = {
  serial: { l: "Modem seriyasi", p: "Seriya raqami..." },
  name:   { l: "Obyekt nomi",    p: "Obyekt nomi..." },
  loc:    { l: "Joylashuv",      p: "Koordinata..." },
  farm:   { l: "Farmoish",       p: "Farmoish..." }
};
const state = { tuman: "all", status: "all", field: "serial", q: "", favOnly: false };
let creds = null, user = null, devices = [], byKey = new Map(), favs = [], favSet = new Set();
let tab = "list", map = null, cluster = null, baseLayer = null, satellite = false, mapDirty = true, needFit = true, userDot = null;
let listItems = [], shown = 0, io = null, lastLoad = 0, loading = false, loadedOnce = false, multi = false, lastError = "";
const iconCache = {};
let dataTxt = "";
let selectedKey = null;   // xaritada oxirgi ochilgan kamera

/* ---------- Server bilan aloqa ---------- */
async function api(body, timeoutMs) {
  let lastErr;
  for (let attempt = 0; attempt < 2; attempt++) {
    const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), timeoutMs || 90000) : null;
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(body),
        signal: ctl ? ctl.signal : undefined
      });
      if (!res.ok) throw new Error("http " + res.status);
      const txt = await res.text();
      const r = JSON.parse(txt);
      Object.defineProperty(r, "_t", { value: txt });
      return r;
    } catch (e) {
      lastErr = e;
    } finally {
      if (timer) clearTimeout(timer);
    }
  }
  throw lastErr;
}

function saveCreds(c, remember) {
  clearCreds();
  try { (remember ? localStorage : sessionStorage).setItem("xsho_c", JSON.stringify(c)); } catch (e) {}
}
function loadCreds() {
  try { return JSON.parse(localStorage.getItem("xsho_c") || sessionStorage.getItem("xsho_c") || "null"); } catch (e) { return null; }
}
function clearCreds() {
  try { localStorage.removeItem("xsho_c"); sessionStorage.removeItem("xsho_c"); } catch (e) {}
}
function favKey() { return "xsho_f_" + (creds ? creds.login.toLowerCase() : ""); }
function loadFavs() {
  try { favs = JSON.parse(localStorage.getItem(favKey()) || "[]"); } catch (e) { favs = []; }
  if (!Array.isArray(favs)) favs = [];
  favSet = new Set(favs);
}
function saveFavs() { try { localStorage.setItem(favKey(), JSON.stringify(favs)); } catch (e) {} }

/* ---------- Telefon xotirasidagi nusxa (keyingi kirishda darrov ochish uchun) ---------- */
function idb() {
  return new Promise((res, rej) => {
    try {
      const q = indexedDB.open("xsho", 1);
      q.onupgradeneeded = () => q.result.createObjectStore("d");
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    } catch (e) { rej(e); }
  });
}
async function cacheGet() {
  try {
    const db = await idb();
    return await new Promise(res => {
      const r = db.transaction("d").objectStore("d").get("last");
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function cachePut(o) {
  try { const db = await idb(); db.transaction("d", "readwrite").objectStore("d").put(o, "last"); } catch (e) {}
}
async function cacheClear() {
  try {
    const db = await idb();
    await new Promise(res => {
      const t = db.transaction("d", "readwrite");
      t.objectStore("d").clear();
      t.oncomplete = () => res();
      t.onerror = () => res();
    });
  } catch (e) {}
}

/* ---------- Ma'lumotni tayyorlash ---------- */
function processData(d) {
  devices = []; byKey = new Map();
  d.tumans.forEach(t => {
    const ix = t.idx;
    t.rows.forEach(r => {
      const v = r.v;
      const dev = {
        k: "", tuman: t.name, cols: t.cols, v: v, g: r.g,
        name: ix.name >= 0 ? v[ix.name] : "",
        farm: ix.farm >= 0 ? v[ix.farm] : "",
        serial: ix.serial >= 0 ? v[ix.serial] : "",
        loc: ix.loc >= 0 ? v[ix.loc] : "",
        _m: null
      };
      dev.on = !!dev.serial;
      dev.k = t.name + "|" + (dev.serial || [v[0], dev.farm, dev.name].join("~"));
      dev._s = { serial: dev.serial.toLowerCase(), name: dev.name.toLowerCase(), loc: dev.loc.toLowerCase(), farm: dev.farm.toLowerCase() };
      let k = dev.k;
      while (byKey.has(k)) k += "'";
      dev.k = k;
      byKey.set(k, dev);
      devices.push(dev);
    });
  });
}

/* ---------- Filtrlash ---------- */
function baseList() {
  let list = state.tuman === "all" ? devices : devices.filter(d => d.tuman === state.tuman);
  let term = state.q.trim().toLowerCase();
  if (term) {
    const f = state.field;
    if (f === "serial") term = term.replace(/\s+/g, "");
    list = list.filter(d => d._s[f].includes(term));
    if (f === "serial") {
      const rank = d => { const s = d._s.serial; return s === term ? 0 : s.startsWith(term) ? 1 : 2; };
      list.sort((a, b) => rank(a) - rank(b));
    }
  }
  return list;
}
function viewList(base) {
  if (state.status === "all") return base;
  return base.filter(d => state.status === "on" ? d.on : !d.on);
}
function mapList() {
  let l = viewList(baseList());
  if (state.favOnly) l = l.filter(d => favSet.has(d.k));
  return l;
}

/* ---------- Chizish: umumiy ---------- */
function renderAll() {
  const base = baseList();
  renderStats(base);
  listItems = viewList(base);
  renderList();
  if (tab === "map") renderMap(); else mapDirty = true;
  if (tab === "fav") renderFav();
  updateFavBadge();
}

function animateNum(el, to) {
  const from = +el.dataset.v || 0;
  el.dataset.v = to;
  if (from === to) { el.textContent = to.toLocaleString("ru-RU"); return; }
  const t0 = performance.now(), dur = 450;
  (function step(t) {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e).toLocaleString("ru-RU");
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

function renderStats(base) {
  let on = 0;
  for (let i = 0; i < base.length; i++) if (base[i].on) on++;
  animateNum($("n-all"), base.length);
  animateNum($("n-on"), on);
  animateNum($("n-off"), base.length - on);
  document.querySelectorAll(".tile").forEach(t => t.classList.toggle("on", t.dataset.status === state.status));
}

/* ---------- Kartalar ---------- */
function detailsHtml(d) {
  let rows = '<div class="drow"><span>Tuman</span><span>' + esc(d.tuman) + '</span></div>';
  d.cols.forEach((c, i) => {
    const v = d.v[i];
    if (v) rows += '<div class="drow"><span>' + esc(c) + '</span><span>' + esc(v) + '</span></div>';
  });
  if (d.g) rows += '<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=' + d.g[0] + ',' + d.g[1] + '">' + ic("nav") + 'Yo\'nalish olish</a>';
  return rows;
}

function statusTag(d) {
  return d.on ? '<span class="tag ok">Ishlayapti</span>' : '<span class="tag wait">Ishga tushmagan</span>';
}

function cardHtml(d, i) {
  const fav = favSet.has(d.k);
  const title = d.name || d.serial || "Nomsiz obyekt";
  return '<article class="card' + (d.g ? "" : " noloc") + '" data-k="' + esc(d.k) + '" style="--i:' + Math.min(i, 12) + '">' +
    '<div class="card-top"><h3>' + esc(title) + '</h3>' +
    '<button class="star' + (fav ? " on" : "") + '" data-fav="' + esc(d.k) + '" aria-label="Tanlash">' + I.star + '</button></div>' +
    '<div class="tags">' + statusTag(d) + (d.g ? "" : '<span class="tag red">Joylashuvi yo\'q</span>') +
    (multi ? '<span class="tag tum">' + esc(d.tuman) + '</span>' : "") + '</div>' +
    '<dl class="main"><div><dt>Modem seriyasi</dt><dd class="mono">' + esc(d.serial || "—") + '</dd></div>' +
    '<div><dt>Farmoish</dt><dd>' + esc(d.farm || "—") + '</dd></div></dl>' +
    '<div class="btns">' + (d.g ? '<button class="btn pri" data-show="' + esc(d.k) + '">' + ic("map") + 'Xaritada</button>' : "") +
    '<button class="btn" data-more>Batafsil<span class="ic chev">' + I.chevron + '</span></button></div>' +
    '<div class="more"><div class="more-in"><div class="more-pad">' + detailsHtml(d) + '</div></div></div>' +
    '</article>';
}

const emptyIcon = '<svg viewBox="0 0 64 64"><circle cx="28" cy="28" r="16"/><path d="M40 40l14 14"/><path d="M22 28h12" stroke-dasharray="2 5"/></svg>';
const favIcon = '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" stroke-dasharray="3 6"/><path d="M32 14l5.4 11 12.1 1.7-8.8 8.5 2.1 12L32 41.6 21.2 47.2l2.1-12-8.8-8.5 12.1-1.7L32 14z"/></svg>';

function renderList() {
  const box = $("listBox");
  box.innerHTML = "";
  shown = 0;
  if (!devices.length) {
    if (loadedOnce && !lastError) {
      box.innerHTML = '<div class="empty">' + emptyIcon + '<b>Obyektlar topilmadi</b><p>Jadvalda ma\'lumot yo\'q yoki sarlavhalar noto\'g\'ri yozilgan.</p></div>';
    } else if (loading || !lastError) {
      box.innerHTML = '<div class="skel"></div><div class="skel" style="animation-delay:.15s"></div><div class="skel" style="animation-delay:.3s"></div><div class="skel" style="animation-delay:.45s"></div>';
    } else {
      box.innerHTML = '<div class="empty">' + emptyIcon + '<b>Ma\'lumot yuklanmadi</b><p>' + esc(lastError) + '</p><button class="btn pri" data-retry>Qayta urinish</button></div>';
    }
    $("resline").textContent = "";
    return;
  }
  $("resline").textContent = listItems.length.toLocaleString("ru-RU") + " ta natija";
  if (!listItems.length) {
    box.innerHTML = '<div class="empty">' + emptyIcon + '<b>Hech narsa topilmadi</b><p>Qidiruv so\'zini yoki filtrni o\'zgartirib ko\'ring.</p></div>';
    return;
  }
  appendChunk();
}

function appendChunk() {
  if (shown >= listItems.length) return;
  const slice = listItems.slice(shown, shown + CHUNK);
  $("listBox").insertAdjacentHTML("beforeend", slice.map((d, i) => cardHtml(d, i)).join(""));
  shown += slice.length;
  const s = $("sentinel");
  if (io) { io.unobserve(s); io.observe(s); }
}

function renderFav() {
  const items = favs.map(k => byKey.get(k)).filter(Boolean);
  $("favCount").textContent = items.length + " ta obyekt";
  $("favBox").innerHTML = items.length
    ? items.map((d, i) => cardHtml(d, i)).join("")
    : '<div class="empty">' + favIcon + '<b>Hali hech narsa tanlanmagan</b><p>Ro\'yxatda yoki xaritada obyektdagi yulduzchani bosing, u shu yerga tushadi.</p></div>';
  $("favMap").hidden = !items.length;
  $("favClear").hidden = !items.length;
}

function updateFavBadge() {
  const n = favs.filter(k => byKey.has(k)).length;
  const b = $("favBadge");
  b.hidden = !n;
  b.textContent = n;
}

/* ---------- Xarita ---------- */
function iconFor(d) {
  const key = (d.on ? "1" : "0") + (favSet.has(d.k) ? "1" : "0");
  if (!iconCache[key]) {
    iconCache[key] = L.divIcon({
      className: "pin", html: pinSvg(d.on ? "#16a34a" : "#f59e0b", favSet.has(d.k)),
      iconSize: [36, 44], iconAnchor: [18, 42], popupAnchor: [0, -38]
    });
  }
  return iconCache[key];
}

function popupHtml(d) {
  const fav = favSet.has(d.k);
  const nav = d.g ? "https://www.google.com/maps/dir/?api=1&destination=" + d.g[0] + "," + d.g[1] : "";
  return '<div class="pp-body"><h4>' + esc(d.name || d.serial || "Nomsiz obyekt") + '</h4>' +
    '<div class="tags">' + statusTag(d) + (multi ? '<span class="tag tum">' + esc(d.tuman) + '</span>' : "") + '</div>' +
    '<dl class="main"><div><dt>Modem seriyasi</dt><dd class="mono">' + esc(d.serial || "—") + '</dd></div>' +
    '<div><dt>Farmoish</dt><dd>' + esc(d.farm || "—") + '</dd></div></dl>' +
    '<div class="btns"><button class="star' + (fav ? " on" : "") + '" data-fav="' + esc(d.k) + '" aria-label="Tanlash">' + I.star + '</button>' +
    '<button class="btn pri" data-detail="' + esc(d.k) + '">Batafsil</button>' +
    (nav ? '<a class="btn" style="flex:none;width:44px" aria-label="Yo\'nalish" target="_blank" rel="noopener" href="' + nav + '">' + ic("nav") + '</a>' : "") +
    '</div></div>';
}

function getMarker(d) {
  if (!d._m) {
    const m = L.marker(d.g, { icon: iconFor(d), keyboard: false });
    m.bindPopup(() => { selectedKey = d.k; return popupHtml(d); }, { maxWidth: 280, minWidth: 230, className: "pp", autoPanPadding: [30, 90] });
    d._m = m;
  }
  return d._m;
}

function setBase() {
  if (baseLayer) map.removeLayer(baseLayer);
  const blank = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
  // Sputnik rasmi 17-darajadan keyin ko'p joyda yo'q (kulrang "Map data not yet available" chiqadi),
  // shuning uchun 17 dan keyin tayyor plitkalarni kattalashtirib ko'rsatamiz (maxNativeZoom).
  baseLayer = satellite
    ? L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, maxNativeZoom: 17, errorTileUrl: blank, attribution: "Tiles &copy; Esri" })
    : L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, maxNativeZoom: 19, errorTileUrl: blank, attribution: "&copy; OpenStreetMap" });
  baseLayer.addTo(map);
  baseLayer.bringToBack();
}

function initMap() {
  map = L.map("map", { zoomControl: false, attributionControl: true, maxZoom: 19 }).setView(MAP_START, 12);
  L.control.zoom({ position: "topright" }).addTo(map);
  setBase();
  cluster = L.markerClusterGroup({
    showCoverageOnHover: false, maxClusterRadius: 55, disableClusteringAtZoom: 18, chunkedLoading: true,
    iconCreateFunction: c => {
      const n = c.getChildCount(), s = n < 10 ? 38 : n < 100 ? 44 : 52;
      return L.divIcon({ html: "<div>" + n + "</div>", className: "cl", iconSize: [s, s] });
    }
  });
  map.addLayer(cluster);
  map.on("locationfound", e => {
    if (userDot) map.removeLayer(userDot);
    userDot = L.marker(e.latlng, { icon: L.divIcon({ className: "", html: '<div class="dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), interactive: false }).addTo(map);
  });
  map.on("click", () => { selectedKey = null; });
  map.on("locationerror", () => toast("Joylashuv aniqlanmadi. Telegram ichida ishlamasa, saytni Chrome yoki Safari'da oching."));
  map.on("popupopen", e => {
    const el = e.popup.getElement();
    if (el && !el._bound) {
      el._bound = true;
      el.addEventListener("click", ev => {
        if (ev.target.closest && ev.target.closest(".leaflet-popup-close-button")) selectedKey = null;
        if (onAction(ev)) ev.stopPropagation();
      });
    }
  });
  renderMap();
}

function renderMap(focus) {
  if (!map) return;
  mapDirty = false;
  const list = mapList();
  const arr = [], pts = [];
  list.forEach(d => { if (d.g) { arr.push(getMarker(d)); pts.push(d.g); } });
  cluster.clearLayers();
  cluster.addLayers(arr);
  const filt = !!state.q.trim() || state.status !== "all" || state.favOnly || (multi && state.tuman !== "all");
  $("mapcount").innerHTML = pts.length.toLocaleString("ru-RU") + " ta obyekt" + (filt ? '<button data-mapclear>Filtrni tozalash</button>' : "");
  $("btnFavOnly").classList.toggle("on", state.favOnly);
  if (needFit && pts.length) {
    map.fitBounds(pts, { padding: [50, 50], maxZoom: 16 });
    needFit = false;
  }
  restoreSelected(focus);
}

/* Eslab qolingan kameraning oynasini qayta ochish (Ro'yxatdan qaytganda ham, xarita qayta chizilganda ham) */
function restoreSelected(focus, tries) {
  tries = tries || 0;
  if (!selectedKey || !map || tab !== "map") return;
  const key = selectedKey;
  const d = byKey.get(key);
  if (!d || !d.g || !mapList().includes(d)) return;
  const m = getMarker(d);
  // marker klaster kutubxonasiga to'liq qo'shilguncha kutamiz (katta ro'yxatda bo'lib-bo'lib qo'shiladi)
  if (!m.__parent && !m._icon) {
    if (tries < 25) setTimeout(() => { if (selectedKey === key) restoreSelected(focus, tries + 1); }, 150);
    return;
  }
  if (m.isPopupOpen && m.isPopupOpen() && !focus) return;
  if (focus) map.setView(d.g, Math.max(map.getZoom(), 16), { animate: false });
  cluster.zoomToShowLayer(m, () => m.openPopup());
}

function showOnMap(k) {
  const d = byKey.get(k);
  if (!d || !d.g) return;
  if (!mapList().includes(d)) {   // qidiruv yoki filtr bu kamerani yashirmasin
    state.tuman = "all"; state.status = "all"; state.q = ""; state.favOnly = false;
    $("q").value = ""; $("qx").hidden = true;
    syncChips();
    renderAll();
  }
  selectedKey = k;
  needFit = false;
  setTab("map", true);
}

/* ---------- Xaritadan Ro'yxatga: obyekt batafsil ochilgan holda ---------- */
function showInList(k) {
  const d = byKey.get(k);
  if (!d) return;
  if (map) map.closePopup();
  if (!listItems.includes(d)) {   // qidiruv yoki filtr bu obyektni yashirmasin
    state.q = ""; state.status = "all"; $("q").value = ""; $("qx").hidden = true;
    if (state.tuman !== "all" && state.tuman !== d.tuman) state.tuman = "all";
    syncChips();
    needFit = true;
    renderAll();
  }
  setTab("list");
  const idx = listItems.indexOf(d);
  while (idx >= shown && shown < listItems.length) appendChunk();
  setTimeout(() => {
    const card = Array.prototype.find.call(document.querySelectorAll("#listBox .card"), c => c.dataset.k === d.k);
    if (!card) return;
    card.classList.add("open");
    card.scrollIntoView({ block: "start", behavior: "auto" });
    card.classList.remove("hl"); void card.offsetWidth; card.classList.add("hl");
  }, 320);
}

/* ---------- Bo'limlar ---------- */
const TABS = ["list", "map", "fav"];
function setTab(t, focus) {
  tab = t;
  TABS.forEach(n => $("tab-" + n).classList.toggle("active", n === t));
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  $("nav").style.setProperty("--t", TABS.indexOf(t));
  $("toolbar").hidden = t !== "list";
  if (t === "map") {
    if (!map) initMap();
    setTimeout(() => {
      if (!map) return;
      map.invalidateSize();
      if (mapDirty || needFit) renderMap(focus); else restoreSelected(focus);
    }, 60);
  }
  if (t === "fav") renderFav();
}

/* ---------- Tanlanganlar ---------- */
function toggleFav(k) {
  const was = favSet.has(k);
  if (was) { favSet.delete(k); favs = favs.filter(x => x !== k); }
  else { favSet.add(k); favs.push(k); }
  saveFavs();
  document.querySelectorAll(".star").forEach(b => {
    if (b.dataset.fav === k) {
      b.classList.toggle("on", !was);
      b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    }
  });
  const d = byKey.get(k);
  if (d && d._m) d._m.setIcon(iconFor(d));
  updateFavBadge();
  if (tab === "fav") setTimeout(renderFav, 250);
  if (state.favOnly && tab === "map") renderMap();
  toast(was ? "Tanlanganlardan olib tashlandi" : "Tanlanganlarga qo'shildi");
}

/* ---------- Bosishlar ---------- */
function onAction(e) {
  const t = e.target;
  if (!t.closest) return false;
  let el;
  if ((el = t.closest("[data-fav]"))) { toggleFav(el.dataset.fav); return true; }
  if ((el = t.closest("[data-more]"))) {
    const box = el.closest(".card,.pp");
    if (box) box.classList.toggle("open");
    if (map) setTimeout(() => { if (map._popup) map._popup.update(); }, 340);
    return true;
  }
  if ((el = t.closest("[data-detail]"))) { showInList(el.dataset.detail); return true; }
  if (t.closest("[data-mapclear]")) {
    state.q = ""; state.status = "all"; state.favOnly = false; state.tuman = "all"; $("q").value = ""; $("qx").hidden = true;
    syncChips(); needFit = true; renderAll(); return true;
  }
  if ((el = t.closest("[data-show]"))) { showOnMap(el.dataset.show); return true; }
  if ((el = t.closest("[data-tuman]"))) {
    state.tuman = el.dataset.tuman; needFit = true; syncChips(); $("tab-list").scrollTop = 0; renderAll(); return true;
  }
  if ((el = t.closest("[data-status]"))) {
    state.status = el.dataset.status; needFit = true; $("tab-list").scrollTop = 0; renderAll(); return true;
  }
  if (t.closest("[data-retry]")) { loadData(false); return true; }
  return false;
}
document.addEventListener("click", onAction);

/* ---------- Tuman tugmalari ---------- */
function buildChips() {
  multi = user.tumans.length > 1;
  const box = $("chips");
  if (!multi) {
    box.hidden = true; state.tuman = "all";
    $("sub").textContent = user.tumans[0] || "";
    return;
  }
  box.hidden = false;
  $("sub").textContent = "Barcha tumanlar";
  box.innerHTML = ["all"].concat(user.tumans).map(t =>
    '<button class="chip" data-tuman="' + esc(t) + '">' + (t === "all" ? "Hammasi" : esc(t)) + '</button>').join("");
  syncChips();
}
function syncChips() {
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.tuman === state.tuman));
}

/* ---------- Kirish / chiqish ---------- */
function showLogin(msg) {
  $("splash").hidden = true;
  $("appView").hidden = true;
  $("loginView").hidden = false;
  $("loginErr").textContent = msg || "";
  const saved = creds || loadCreds();
  if (saved && saved.login && !$("login").value) $("login").value = saved.login;
}

function enterApp() {
  $("splash").hidden = true;
  $("loginView").hidden = true;
  $("appView").hidden = false;
  const nm = user.ism || creds.login;
  $("btnUser").textContent = nm.trim().charAt(0).toUpperCase();
  $("mName").textContent = nm;
  $("mRole").textContent = user.lavozim;
  loadFavs();
  buildChips();
  state.status = "all"; state.q = ""; state.favOnly = false; state.field = "serial";
  $("q").value = ""; $("field").value = "serial"; $("q").placeholder = FIELDS.serial.p; $("qx").hidden = true;
  updateMenu();
  setTab("list");
  renderAll();
}

function updateMenu() {
  let t = user ? (user.tumans.join(", ")) : "";
  let when = lastLoad ? "Yangilandi: " + new Date(lastLoad).toTimeString().slice(0, 5) : "";
  $("mMeta").innerHTML = esc(t) + (when ? "<br>" + esc(when) : "");
}

async function logout(msg) {
  clearCreds();
  try { if (msg) sessionStorage.setItem("xsho_msg", msg); } catch (e) {}
  try { await Promise.race([cacheClear(), new Promise(r => setTimeout(r, 800))]); } catch (e) {}
  location.reload();
}

/* ---------- Ma'lumotni yuklash ---------- */
function applyData(r) {
  user = r.user;
  processData(r);
  dataTxt = r._t || "";
  lastLoad = Date.now();
  lastError = "";
  if (!loadedOnce) needFit = true;
  loadedOnce = true;
  updateMenu();
  if (r.missing && r.missing.length) toast("Varaq topilmadi: " + r.missing.join(", "));
}

async function loadData(silent) {
  if (loading || !creds) return;
  loading = true;
  $("btnRefresh").classList.add("spin");
  if (!devices.length) renderList();
  try {
    const r = await api({ action: "data", login: creds.login, password: creds.password });
    if (!r.ok) {
      const m = r.error || "Xatolik";
      if (/login|parol|bloklan|ko'p xato|biriktirilmagan/i.test(m)) { logout(m); return; }
      lastError = m;
      toast(m);
    } else if (devices.length && r._t && r._t === dataTxt) {
      lastLoad = Date.now();
      updateMenu();
      if (!silent) toast("Ma'lumot yangilandi");
    } else {
      applyData(r);
      cachePut({ login: creds.login, ts: lastLoad, t: r._t || "" });
      if (!silent) toast("Ma'lumot yangilandi");
    }
  } catch (e) {
    lastError = "Aloqa xatosi. Internetni tekshirib, qayta urinib ko'ring.";
    if (!silent || !devices.length) toast("Aloqa xatosi");
  } finally {
    loading = false;
    $("btnRefresh").classList.remove("spin");
    renderAll();
  }
}

/* ---------- Xabar ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- Hodisalar ---------- */
$("eye").addEventListener("click", () => {
  const p = $("password"), show = p.type === "password";
  p.type = show ? "text" : "password";
  $("eye").innerHTML = ic(show ? "eyeoff" : "eye");
});

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const login = $("login").value.trim(), password = $("password").value;
  const btn = $("loginBtn"), card = $("loginForm"), msg = $("loginErr");
  btn.disabled = true; btn.textContent = "Ma'lumot yuklanmoqda...";
  msg.className = ""; msg.textContent = "";
  const t0 = Date.now();
  const hint = setInterval(() => {
    const sec = Math.round((Date.now() - t0) / 1000);
    if (sec >= 6) { msg.className = "hint"; msg.textContent = "Yuklanmoqda... " + sec + " s. Birinchi marta biroz kutish kerak bo'lishi mumkin."; }
  }, 1000);
  try {
    const r = await api({ action: "data", login: login, password: password });
    if (!r.ok) {
      msg.className = ""; msg.textContent = r.error || "Xatolik";
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
      return;
    }
    creds = { login: login, password: password };
    saveCreds(creds, $("remember").checked);
    $("password").value = "";
    applyData(r);
    cachePut({ login: login, ts: lastLoad, t: r._t || "" });
    enterApp();
  } catch (err) {
    msg.className = ""; msg.textContent = "Aloqa xatosi. Internetni tekshirib, qayta urinib ko'ring.";
  } finally {
    clearInterval(hint);
    btn.disabled = false; btn.textContent = "Kirish";
  }
});

$("btnRefresh").addEventListener("click", () => loadData(false));
$("mRefresh").addEventListener("click", () => { $("menu").hidden = true; loadData(false); });
$("mLogout").addEventListener("click", () => logout());
$("btnUser").addEventListener("click", e => { e.stopPropagation(); $("menu").hidden = !$("menu").hidden; });
document.addEventListener("click", e => { if (!e.target.closest(".menu") && !e.target.closest("#btnUser")) $("menu").hidden = true; });

Object.keys(FIELDS).forEach(k => {
  const o = document.createElement("option");
  o.value = k; o.textContent = FIELDS[k].l;
  $("field").appendChild(o);
});
$("field").addEventListener("change", () => {
  state.field = $("field").value;
  $("q").placeholder = FIELDS[state.field].p;
  needFit = true; renderAll();
});
$("q").placeholder = FIELDS.serial.p;
let qTimer = null;
$("q").addEventListener("input", () => {
  $("qx").hidden = !$("q").value;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = $("q").value; needFit = true; $("tab-list").scrollTop = 0; renderAll(); }, 180);
});
$("qx").addEventListener("click", () => {
  $("q").value = ""; $("qx").hidden = true; state.q = ""; needFit = true; renderAll(); $("q").focus();
});

document.querySelectorAll("#nav button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

$("btnLocate").addEventListener("click", () => { if (map) map.locate({ setView: true, maxZoom: 17, enableHighAccuracy: true }); });
$("btnLayer").addEventListener("click", () => { satellite = !satellite; setBase(); toast(satellite ? "Yo'ldosh xaritasi" : "Oddiy xarita"); });
$("btnFavOnly").addEventListener("click", () => {
  state.favOnly = !state.favOnly; needFit = true; renderMap();
  toast(state.favOnly ? "Faqat tanlanganlar ko'rsatilmoqda" : "Hamma obyektlar ko'rsatilmoqda");
});
$("favMap").addEventListener("click", () => { state.favOnly = true; needFit = true; setTab("map"); renderMap(); });
let clearArm = 0;
$("favClear").addEventListener("click", () => {
  const lbl = $("favClear").lastChild;
  if (!clearArm) {
    lbl.textContent = "Aniqmi?";
    clearArm = setTimeout(() => { clearArm = 0; lbl.textContent = "Tozalash"; }, 3000);
    return;
  }
  clearTimeout(clearArm); clearArm = 0; lbl.textContent = "Tozalash";
  favs = []; favSet = new Set(); saveFavs();
  devices.forEach(d => { if (d._m) d._m.setIcon(iconFor(d)); });
  state.favOnly = false; mapDirty = true;
  renderFav(); updateFavBadge();
});

if ("IntersectionObserver" in window) {
  io = new IntersectionObserver(en => { if (en[0].isIntersecting) appendChunk(); }, { root: $("tab-list"), rootMargin: "400px" });
  io.observe($("sentinel"));
}

setInterval(() => { if (creds && user && !document.hidden) loadData(true); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && creds && user && Date.now() - lastLoad > REFRESH_MS) loadData(true);
});

/* ---------- Ishga tushirish ---------- */
(async function start() {
  let msg = "";
  try { msg = sessionStorage.getItem("xsho_msg") || ""; sessionStorage.removeItem("xsho_msg"); } catch (e) {}
  creds = loadCreds();
  if (!creds || !creds.login) { creds = null; showLogin(msg); return; }

  // 1) Telefonda oxirgi nusxa bor bo'lsa — darrov ochamiz, yangisini fonda olamiz
  const c = await cacheGet();
  if (c && c.login === creds.login && c.t) {
    try {
      const r = JSON.parse(c.t);
      if (r && r.ok && r.tumans) {
        Object.defineProperty(r, "_t", { value: c.t });
        applyData(r);
        lastLoad = c.ts || Date.now();
        updateMenu();
        enterApp();
        loadData(true);
        return;
      }
    } catch (e) {}
  }

  // 2) Nusxa yo'q — ma'lumot to'liq kelguncha kutamiz, keyin saytga kiramiz
  const hintTimer = setTimeout(() => { $("splashTxt").textContent = "Birinchi marta yuklash biroz vaqt oladi, kuting..."; }, 6000);
  try {
    const r = await api({ action: "data", login: creds.login, password: creds.password });
    if (!r.ok) {
      const m = r.error || "Xatolik";
      if (/login|parol|bloklan|ko'p xato|biriktirilmagan/i.test(m)) clearCreds();
      showLogin(m);
      return;
    }
    applyData(r);
    cachePut({ login: creds.login, ts: lastLoad, t: r._t || "" });
    enterApp();
  } catch (e) {
    showLogin("Aloqa xatosi. Internetni tekshirib, qayta kiring.");
  } finally {
    clearTimeout(hintTimer);
  }
})();

/* ---------- Telegram ichida ochilganda: to'liq balandlik, pastga surib yopilib ketmasin ---------- */
function tgInit() {
  try {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (!tg) return;
    tg.ready(); tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if (tg.setHeaderColor) tg.setHeaderColor("#0a1020");
    if (tg.setBackgroundColor) tg.setBackgroundColor("#0a1020");
  } catch (e) {}
}
tgInit();
window.addEventListener("load", tgInit);

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
