<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sklad iOS 27 Next-Gen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ios-bg: #000000;
  --ios-glass: rgba(255, 255, 255, 0.07);
  --ios-glass-thick: rgba(255, 255, 255, 0.12);
  --ios-border: rgba(255, 255, 255, 0.15);
  --ios-accent: #0a84ff;
  --ios-accent-glow: rgba(10, 132, 255, 0.4);
  --ios-purple: #bf5af2;
  --ios-green: #30d158;
  --ios-orange: #ff9f0a;
  --ios-red: #ff453a;
  
  --text-main: #ffffff;
  --text-sub: rgba(235, 235, 245, 0.6);
  --mono: 'JetBrains Mono', monospace;
  --app-max-width: 430px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
html, body { height: 100%; margin: 0; padding: 0; background: var(--ios-bg); color: var(--text-main); }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  display: flex;
  justify-content: center;
  background: radial-gradient(1200px 800px at 50% -20%, #1c1c38 0%, #000000 100%) fixed;
  overflow-x: hidden;
}

.mono { font-family: var(--mono); }

/* iOS Dynamic Island Header */
.dynamic-island-wrapper {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: calc(var(--app-max-width) - 32px);
  z-index: 1000;
}

.dynamic-island {
  background: rgba(15, 15, 20, 0.75);
  backdrop-filter: blur(30px) saturate(200%);
  -webkit-backdrop-filter: blur(30px) saturate(200%);
  border: 1px solid var(--ios-border);
  border-radius: 28px;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.island-brand { display: flex; align-items: center; gap: 10px; }
.island-logo {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--ios-accent), var(--ios-purple));
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  box-shadow: 0 0 12px var(--ios-accent-glow);
}
.island-title { font-size: 13px; font-weight: 700; letter-spacing: -0.2px; }
.island-status { font-size: 10px; color: var(--ios-green); display: flex; align-items: center; gap: 4px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ios-green); box-shadow: 0 0 8px var(--ios-green); }

/* Main Container */
.app-viewport {
  width: 100%;
  max-width: var(--app-max-width);
  padding: 84px 16px 120px;
  min-height: 100vh;
}

/* iOS Widget Grid */
.widget-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}

.ios-widget {
  background: var(--ios-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--ios-border);
  border-radius: 22px;
  padding: 14px 10px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease, background 0.2s ease;
}
.ios-widget:active { transform: scale(0.95); background: var(--ios-glass-thick); }
.ios-widget .val { font-size: 22px; font-weight: 800; font-family: var(--mono); letter-spacing: -1px; }
.ios-widget .lbl { font-size: 10px; color: var(--text-sub); margin-top: 4px; font-weight: 600; text-transform: uppercase; }

/* Futuristic Search Bar */
.search-container {
  position: relative;
  margin-bottom: 20px;
}
.search-input {
  width: 100%;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--ios-border);
  border-radius: 18px;
  padding: 14px 16px 14px 44px;
  color: #fff;
  font-size: 14px;
  backdrop-filter: blur(15px);
  transition: all 0.3s ease;
}
.search-input:focus {
  border-color: var(--ios-accent);
  background: rgba(255, 255, 255, 0.1);
  box-shadow: 0 0 20px rgba(10, 132, 255, 0.2);
}
.search-icon-svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-sub);
  pointer-events: none;
}

/* iOS 27 Next-Gen Device Card */
.card-flow { display: flex; flex-direction: column; gap: 14px; }

.ios-card {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
  backdrop-filter: blur(30px) saturate(190%);
  -webkit-backdrop-filter: blur(30px) saturate(190%);
  border: 1px solid var(--ios-border);
  border-radius: 26px;
  padding: 18px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  transform-style: preserve-3d;
}

.ios-card:active {
  transform: scale(0.97) rotateX(2deg);
  border-color: rgba(255,255,255,0.3);
}

.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.card-sn { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--ios-accent); letter-spacing: 0.5px; }
.card-sub { font-size: 12px; color: var(--text-sub); margin-top: 3px; font-weight: 500; }

.ios-tag {
  padding: 5px 12px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  background: rgba(10, 132, 255, 0.15);
  color: var(--ios-accent);
  border: 1px solid rgba(10, 132, 255, 0.3);
}

.card-actions-row { display: flex; gap: 8px; margin-top: 16px; }

.ios-btn {
  flex: 1;
  padding: 12px;
  border-radius: 16px;
  border: 1px solid var(--ios-border);
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s ease;
}

.ios-btn-primary {
  background: linear-gradient(135deg, var(--ios-accent), #0056b3);
  border: none;
  box-shadow: 0 6px 20px var(--ios-accent-glow);
}

.ios-btn:active { transform: scale(0.94); opacity: 0.8; }

/* Floating Liquid Dock (Bottom Nav) */
.dock-wrapper {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: calc(var(--app-max-width) - 32px);
  z-index: 1000;
}

.ios-dock {
  background: rgba(20, 20, 25, 0.7);
  backdrop-filter: blur(35px) saturate(210%);
  -webkit-backdrop-filter: blur(35px) saturate(210%);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 32px;
  padding: 8px;
  display: flex;
  justify-content: space-around;
  box-shadow: 0 25px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

.dock-item {
  background: transparent;
  border: none;
  color: var(--text-sub);
  padding: 10px 18px;
  border-radius: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
}

.dock-item.active {
  color: #fff;
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

.dock-item.active::after {
  content: '';
  position: absolute;
  bottom: 4px;
  width: 12px;
  height: 3px;
  border-radius: 100px;
  background: var(--ios-accent);
  box-shadow: 0 0 8px var(--ios-accent);
}

/* Native Bottom Sheet Modal */
.sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(10px);
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.sheet-overlay.active { opacity: 1; pointer-events: auto; }

.bottom-sheet {
  background: rgba(25, 25, 30, 0.95);
  backdrop-filter: blur(40px);
  border: 1px solid var(--ios-border);
  border-radius: 36px 36px 0 0;
  width: 100%;
  max-width: var(--app-max-width);
  padding: 24px;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.sheet-overlay.active .bottom-sheet { transform: translateY(0); }
.sheet-handle { width: 36px; height: 5px; background: rgba(255, 255, 255, 0.3); border-radius: 100px; margin: 0 auto 18px; }
</style>
</head>
<body>

<!-- iOS Dynamic Island Header -->
<div class="dynamic-island-wrapper">
  <div class="dynamic-island">
    <div class="island-brand">
      <div class="island-logo">📦</div>
      <div>
        <div class="island-title">Sklad CRM Pro</div>
        <div class="island-status"><span class="status-dot"></span> Onlayn · Cloud Sync</div>
      </div>
    </div>
    <div style="font-size:12px; font-weight:700; color:var(--text-sub);" id="userRole">Admin</div>
  </div>
</div>

<!-- Main App Viewport -->
<div class="app-viewport">
  
  <!-- Widgets -->
  <div class="widget-grid">
    <div class="ios-widget">
      <div class="val" style="color:var(--ios-accent)" id="statSklad">42</div>
      <div class="lbl">Skladda</div>
    </div>
    <div class="ios-widget">
      <div class="val" style="color:var(--ios-purple)" id="statMening">8</div>
      <div class="lbl">Mening</div>
    </div>
    <div class="ios-widget">
      <div class="val" style="color:var(--ios-green)" id="statChiqim">128</div>
      <div class="lbl">O'rnatilgan</div>
    </div>
  </div>

  <!-- Search -->
  <div class="search-container">
    <svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" class="search-input" placeholder="S/N yoki model bo'yicha qidiruv...">
  </div>

  <!-- Cards List -->
  <div class="card-flow" id="mainCardsContainer">
    
    <!-- Sample Card 1 -->
    <div class="ios-card" onclick="triggerHaptic()">
      <div class="card-top">
        <div>
          <div class="card-sn">SN-88492019</div>
          <div class="card-sub">HUAWEI HG8145V5 · GPON</div>
        </div>
        <span class="ios-tag">Buxoro</span>
      </div>
      <div class="card-actions-row">
        <button class="ios-btn ios-btn-primary" onclick="openActionSheet('SN-88492019')">Olish</button>
        <button class="ios-btn">Batafsil</button>
      </div>
    </div>

    <!-- Sample Card 2 -->
    <div class="ios-card" onclick="triggerHaptic()">
      <div class="card-top">
        <div>
          <div class="card-sn">SN-77301924</div>
          <div class="card-sub">ZTE F660 V8.0 · DualBand</div>
        </div>
        <span class="ios-tag" style="color:var(--ios-purple); border-color:rgba(191,90,242,0.3); background:rgba(191,90,242,0.15)">Kogon</span>
      </div>
      <div class="card-actions-row">
        <button class="ios-btn ios-btn-primary" onclick="openActionSheet('SN-77301924')">Olish</button>
        <button class="ios-btn">Batafsil</button>
      </div>
    </div>

  </div>
</div>

<!-- Floating Liquid Dock -->
<div class="dock-wrapper">
  <div class="ios-dock">
    <button class="dock-item active" onclick="switchTab(this)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
      Sklad
    </button>
    <button class="dock-item" onclick="switchTab(this)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.4 14.5 16 10 4 20"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
      Mening
    </button>
    <button class="dock-item" onclick="switchTab(this)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      Tarix
    </button>
  </div>
</div>

<!-- Bottom Action Sheet Modal -->
<div class="sheet-overlay" id="actionSheet" onclick="closeActionSheet(event)">
  <div class="bottom-sheet">
    <div class="sheet-handle"></div>
    <h3 style="margin:0 0 6px; font-size:18px;" id="sheetTitle">Qurilmani olish</h3>
    <p style="margin:0 0 20px; font-size:13px; color:var(--text-sub);">Qurilma muddatini va talabnoma ma'lumotlarini tasdiqlang</p>
    
    <button class="ios-btn ios-btn-primary" style="width:100%; padding:15px; margin-bottom:10px;" onclick="closeActionSheet()">Tasdiqlash va Olish</button>
    <button class="ios-btn" style="width:100%; padding:15px; background:transparent; border:none;" onclick="closeActionSheet()">Bekor qilish</button>
  </div>
</div>

<script>
  // Haptic Feedback Simulation (Agar telefon qo'llab-quvvatlasa)
  function triggerHaptic() {
    if (navigator.vibrate) {
      navigator.vibrate(12);
    }
  }

  // Tab Switcher
  function switchTab(el) {
    triggerHaptic();
    document.querySelectorAll('.dock-item').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
  }

  // Bottom Sheet Controls
  function openActionSheet(sn) {
    triggerHaptic();
    document.getElementById('sheetTitle').innerText = "Qurilma: " + sn;
    document.getElementById('actionSheet').classList.add('active');
  }

  function closeActionSheet(e) {
    if (!e || e.target.classList.contains('sheet-overlay') || e.target.tagName === 'BUTTON') {
      document.getElementById('actionSheet').classList.remove('active');
    }
  }
</script>
</body>
</html>
