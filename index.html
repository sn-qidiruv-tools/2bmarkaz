<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kabel ombor tizimi</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;
      --radius: 14px;
      font-family: Inter, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
    }

    .btn-primary {
      color: white;
      background: var(--primary);
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .btn-light {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn-danger {
      color: white;
      background: var(--danger);
    }

    .hidden { display: none !important; }

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(15, 23, 42, .1);
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .muted { color: var(--muted); }

    .field {
      display: grid;
      gap: 6px;
      margin: 14px 0;
    }

    .field label {
      font-size: 14px;
      font-weight: 600;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      background: white;
      color: var(--text);
    }

    .field textarea {
      min-height: 80px;
      resize: vertical;
    }

    .error {
      color: var(--danger);
      font-size: 14px;
      margin-top: 10px;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      flex: 0 0 250px;
      background: #0f2850;
      color: white;
      padding: 22px 14px;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      padding: 0 10px 22px;
    }

    .nav {
      display: grid;
      gap: 7px;
    }

    .nav button {
      text-align: left;
      color: #dbeafe;
      background: transparent;
      width: 100%;
    }

    .nav button.active, .nav button:hover {
      background: rgba(255,255,255,.14);
      color: white;
    }

    .main {
      min-width: 0;
      flex: 1;
      padding: 22px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .topbar h2 {
      margin: 0;
      font-size: 23px;
    }

    .user-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .content {
      display: grid;
      gap: 18px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 3px 12px rgba(15,23,42,.03);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .panel-head h3 {
      margin: 0;
      font-size: 17px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .stat {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .stat .label {
      font-size: 13px;
      color: var(--muted);
    }

    .stat .value {
      margin-top: 8px;
      font-size: 24px;
      font-weight: 800;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
    }

    .toolbar input, .toolbar select {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      padding: 10px 12px;
      min-width: 160px;
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
      font-size: 14px;
    }

    th, td {
      text-align: left;
      padding: 11px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
      background: #f8fafc;
      position: sticky;
      top: 0;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
      background: #e2e8f0;
    }

    .badge.ok { color: #166534; background: #dcfce7; }
    .badge.low { color: #92400e; background: #fef3c7; }
    .badge.empty { color: #991b1b; background: #fee2e2; }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .actions button {
      padding: 7px 9px;
      font-size: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 14px;
    }

    .full { grid-column: 1 / -1; }

    .notice {
      padding: 12px 14px;
      border-radius: 10px;
      background: #eff6ff;
      color: #1e40af;
      font-size: 14px;
    }

    .loading {
      color: var(--muted);
      padding: 20px 0;
    }

    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sidebar { width: 210px; flex-basis: 210px; }
    }

    @media (max-width: 650px) {
      .app-shell { display: block; }
      .sidebar { width: 100%; padding: 12px; }
      .brand { padding: 4px 8px 12px; }
      .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .main { padding: 14px; }
      .stats { grid-template-columns: 1fr 1fr; gap: 9px; }
      .stat { padding: 12px; }
      .stat .value { font-size: 19px; }
      .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1>Kabel ombor tizimi</h1>
      <p class="muted">Tizimga kirish uchun login va parolingizni kiriting.</p>
      <form id="loginForm">
        <div class="field">
          <label for="login">Login</label>
          <input id="login" name="login" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Parol</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit" style="width:100%">Kirish</button>
        <div id="loginError" class="error"></div>
      </form>
    </div>
  </section>

  <div id="app" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">KABEL OMBOR</div>
      <nav class="nav">
        <button data-page="dashboard" class="active">Bosh sahifa</button>
        <button data-page="drums">Barabanlar</button>
        <button data-page="usage">Sarf hisobi</button>
        <button data-page="cables">Kabel turlari</button>
        <button data-page="users" id="usersNav">Foydalanuvchilar</button>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <h2 id="pageTitle">Bosh sahifa</h2>
        <div class="user-tools">
          <span id="currentUser" class="muted"></span>
          <button id="logoutBtn" class="btn-light">Chiqish</button>
        </div>
      </header>
      <section id="pageContent" class="content">
        <div class="loading">Ma’lumotlar yuklanmoqda…</div>
      </section>
    </main>
  </div>
